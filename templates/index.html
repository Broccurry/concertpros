<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConcertPros</title>
<style>
  :root{
    --ink:#16181d; --ink-2:#3d434f; --ink-3:#6b7382;
    --ground:#f2f3f6; --surface:#fff; --line:#d5d9e2;
    --accent:#2a3d8f; --accent-soft:#e6e9f6;
    --confirm:#1c6b45; --confirm-bg:#c9ecd8;
    --display:"Oswald","Arial Narrow",sans-serif;
    --body:"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  .brand{font-family:var(--display);font-weight:600;font-size:24px;text-transform:uppercase;
         letter-spacing:.02em;margin:0 0 20px;text-align:center}
  .brand span{color:var(--accent)}

  #loginCard{background:var(--surface);border:1px solid var(--line);border-radius:8px;
             padding:28px;width:320px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  #loginCard label{display:block;font-size:12px;color:var(--ink-3);margin:12px 0 4px}
  #loginCard input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;
                    font-size:14px}
  #loginCard button{width:100%;margin-top:18px;padding:10px;border:0;border-radius:6px;
                     background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  #loginError{color:#9a3b3b;font-size:12.5px;margin-top:10px;min-height:1em}

  #app{display:none;width:100%;max-width:900px;padding:20px}
  #topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  #topbar .who{color:var(--ink-3);font-size:13px}
  #logoutBtn{border:1px solid var(--line);background:var(--surface);
             border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
  #bookBtn{margin-left:auto;border:0;background:var(--accent);color:#fff;font-weight:600;
           border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer}

  #bookForm{background:var(--surface);border:1px solid var(--line);border-radius:8px;
            padding:16px;margin-bottom:16px;display:none}
  #bookForm .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  #bookForm .field{flex:1;min-width:140px}
  #bookForm label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
  #bookForm input,#bookForm select{width:100%;padding:8px 9px;border:1px solid var(--line);
                                    border-radius:6px;font-size:13.5px}
  #bookForm .actions{display:flex;gap:8px;align-items:center}
  #bookForm button{border:0;border-radius:6px;padding:9px 16px;font-size:13.5px;cursor:pointer}
  #bookSubmit{background:var(--accent);color:#fff;font-weight:600}
  #bookCancel{background:var(--ground);color:var(--ink-2)}
  #bookError{color:#9a3b3b;font-size:12.5px}

  #staffPanel{background:var(--surface);border:1px solid var(--line);border-radius:8px;
              padding:14px 16px;margin:-6px 0 16px}
  #staffPanel .row{margin-bottom:0}
  #staffPanel select{padding:7px 8px}
  #staffAddBtn{background:var(--ground);color:var(--ink-2);border:1px solid var(--line);
               white-space:nowrap;padding:7px 12px}
  .staffRow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
  .staffRow .role{color:var(--ink-3);width:110px;flex:none}
  .staffRow button{border:0;background:none;color:#9a3b3b;cursor:pointer;font-size:13px;margin-left:auto}

  #settlementPanel{background:var(--surface);border:1px solid var(--line);border-radius:8px;
                   padding:14px 16px;margin:-6px 0 16px}
  #settlementPanel .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  #settlementPanel .field{flex:1;min-width:120px}
  #settlementPanel label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
  #settlementPanel input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;
                          font-size:13.5px}
  #settlementPanel .actions{display:flex;gap:8px;align-items:center}
  #setSaveBtn{border:0;background:var(--accent);color:#fff;font-weight:600;border-radius:6px;
              padding:8px 14px;font-size:13px;cursor:pointer}
  #setError{color:#9a3b3b;font-size:12.5px}

  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
        border-radius:8px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px}
  th{background:var(--ground);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
     color:var(--ink-3)}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;
        background:var(--confirm-bg);color:var(--confirm)}
  #empty{text-align:center;color:var(--ink-3);padding:30px;background:var(--surface);
         border:1px dashed var(--line);border-radius:8px}

  #navTabs{display:flex;gap:2px;background:var(--ground);padding:2px;border-radius:6px}
  .navBtn{border:0;background:transparent;color:var(--ink-3);padding:6px 12px;border-radius:5px;
          font-size:13px;cursor:pointer}
  .navBtn[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600}

  #addPersonBtn{border:0;background:var(--accent);color:#fff;font-weight:600;border-radius:6px;
                padding:8px 14px;font-size:13px;cursor:pointer;margin-bottom:12px}
  #personForm{background:var(--surface);border:1px solid var(--line);border-radius:8px;
              padding:16px;margin-bottom:16px}
  #personForm .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  #personForm .field{flex:1;min-width:140px}
  #personForm label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:3px}
  #personForm input,#personForm select{width:100%;padding:8px 9px;border:1px solid var(--line);
                                        border-radius:6px;font-size:13.5px}
  #personForm .actions{display:flex;gap:8px;align-items:center;margin-top:4px}
  #personForm button{border:0;border-radius:6px;padding:9px 16px;font-size:13.5px;cursor:pointer}
  #pSaveBtn{background:var(--accent);color:#fff;font-weight:600}
  #pCancelBtn{background:var(--ground);color:var(--ink-2)}
  #pResetBtn{background:var(--ground);color:var(--ink-2);border:1px solid var(--line)}
  #pError{color:#9a3b3b;font-size:12.5px}
  #pTempPassword{margin-top:10px;padding:10px 12px;background:var(--accent-soft);color:var(--accent);
                 border-radius:6px;font-size:13px}
  .roleChip{display:flex;align-items:center;gap:5px;font-size:13px}
  .roleChip input{width:auto}
  .pill-muted{background:var(--ground);color:var(--ink-3)}
</style>
</head>
<body>

<div id="loginCard">
  <h1 class="brand">Concert<span>Pros</span></h1>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div id="loginError"></div>
  </form>
</div>

<div id="app">
  <div id="topbar">
    <h1 class="brand" style="margin:0;font-size:19px">Concert<span>Pros</span></h1>
    <div id="navTabs" style="display:none">
      <button type="button" class="navBtn" data-view="calendar">Calendar</button>
      <button type="button" class="navBtn" data-view="people">People</button>
    </div>
    <span class="who" id="whoami"></span>
    <button id="bookBtn" style="display:none">+ Book a show</button>
    <button id="logoutBtn">Log out</button>
  </div>

<div id="calendarView">
  <form id="bookForm">
    <div class="row">
      <div class="field">
        <label for="bookVenue">Venue</label>
        <select id="bookVenue" required></select>
      </div>
      <div class="field">
        <label for="bookBand">Band</label>
        <input id="bookBand" list="artistNames" required placeholder="Start typing…">
        <datalist id="artistNames"></datalist>
      </div>
      <div class="field">
        <label for="bookDate">Date</label>
        <input id="bookDate" type="date" required>
      </div>
      <div class="field">
        <label for="bookStatus">Status</label>
        <select id="bookStatus">
          <option value="hold1">1st hold</option>
          <option value="hold2">2nd hold</option>
          <option value="hold3">3rd hold</option>
          <option value="confirmed">Confirmed</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button type="submit" id="bookSubmit">Book it</button>
      <button type="button" id="bookCancel">Cancel</button>
      <span id="bookError"></span>
    </div>
  </form>

  <div id="staffPanel" style="display:none">
    <div id="staffList"></div>
    <div class="row" style="margin-top:8px">
      <div class="field">
        <select id="staffRole"></select>
      </div>
      <div class="field">
        <select id="staffPerson"></select>
      </div>
      <div class="field" style="flex:0">
        <button type="button" id="staffAddBtn">+ Assign</button>
      </div>
    </div>
  </div>

  <div id="settlementPanel" style="display:none">
    <div class="row">
      <div class="field">
        <label for="setTickets">Tickets sold</label>
        <input id="setTickets" type="number" min="0">
      </div>
      <div class="field">
        <label for="setGross">Gross</label>
        <input id="setGross" type="number" step="0.01">
      </div>
      <div class="field">
        <label for="setExpenses">Expenses</label>
        <input id="setExpenses" type="number" step="0.01">
      </div>
      <div class="field">
        <label for="setPayout">Artist payout</label>
        <input id="setPayout" type="number" step="0.01">
      </div>
    </div>
    <div class="row" style="align-items:center">
      <div class="field" style="flex:0;white-space:nowrap">
        <label style="font-weight:normal;display:flex;align-items:center;gap:6px">
          <input id="setSettled" type="checkbox" style="width:auto"> Settled and paid
        </label>
      </div>
      <div class="field" id="setNet" style="color:var(--ink-3);font-size:13px;flex:2"></div>
    </div>
    <div class="actions">
      <button type="button" id="setSaveBtn">Save finals</button>
      <span id="setError"></span>
    </div>
  </div>

  <div id="eventsHost"></div>
</div>

<div id="peopleView" style="display:none">
  <button type="button" id="addPersonBtn">+ Add a person</button>
  <div id="peopleHost"></div>

  <div id="personForm" style="display:none">
    <div class="row">
      <div class="field">
        <label for="pName">Name</label>
        <input id="pName">
      </div>
      <div class="field">
        <label for="pEmail">Email</label>
        <input id="pEmail" type="email">
      </div>
      <div class="field">
        <label for="pPhone">Phone</label>
        <input id="pPhone" type="tel">
      </div>
      <div class="field">
        <label for="pAccess">Access</label>
        <select id="pAccess">
          <option value="crew">Crew</option>
          <option value="booker">Booker</option>
          <option value="owner">Owner</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Active</label>
        <label style="font-weight:normal;display:flex;align-items:center;gap:6px;margin-top:6px">
          <input id="pActive" type="checkbox" style="width:auto" checked> Active
        </label>
      </div>
      <div class="field" style="flex:2">
        <label>Roles they cover</label>
        <div id="pRoles" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px"></div>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="pSaveBtn">Save</button>
      <button type="button" id="pCancelBtn">Cancel</button>
      <button type="button" id="pResetBtn" style="display:none">Reset password</button>
      <span id="pError"></span>
    </div>
    <div id="pTempPassword" style="display:none"></div>
  </div>
</div>

<script>
async function api(path, opts) {
  const res = await fetch(path, Object.assign(
    {credentials: "same-origin", headers: {"Content-Type": "application/json"}}, opts));
  const body = await res.json().catch(() => ({}));
  return {ok: res.ok, status: res.status, body};
}

function showApp() { document.getElementById("loginCard").style.display = "none"; document.getElementById("app").style.display = "block"; }
function showLogin() { document.getElementById("loginCard").style.display = "block"; document.getElementById("app").style.display = "none"; }

function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"});
}
function fmtTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  const ap = h >= 12 ? "pm" : "am";
  const h12 = h % 12 || 12;
  return m ? `${h12}:${String(m).padStart(2,"0")}${ap}` : `${h12}${ap}`;
}

let lastEvents = [];
let lastPeople = [];
let allRoles = [];
let canBook = false;
let myAccessLevel = "crew";
let editingId = null;
let editingVersion = null;
let editingPersonId = null;
let currentView = "calendar";

async function loadEvents() {
  const {ok, body} = await api("/api/events");
  const host = document.getElementById("eventsHost");
  if (!ok) { host.innerHTML = "<div id='empty'>Could not load events.</div>"; return; }
  if (!body.events.length) { host.innerHTML = "<div id='empty'>Nothing booked yet.</div>"; return; }
  lastEvents = body.events;
  const rows = body.events.map(e => `
    <tr data-id="${e.id}" style="${canBook ? "cursor:pointer" : ""}">
      <td>${fmtDate(e.show_date)}</td>
      <td>${e.venue}</td>
      <td><strong>${e.headliner}</strong>${e.support ? `<div style="color:var(--ink-3);font-size:12px">${e.support}</div>` : ""}</td>
      <td>${fmtTime(e.doors)}</td>
      <td>${e.status ? `<span class="pill">${e.status}</span>` : ""}</td>
    </tr>`).join("");
  host.innerHTML = `<table><thead><tr><th>Date</th><th>Venue</th><th>Show</th><th>Doors</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
  if (canBook) {
    host.querySelectorAll("tr[data-id]").forEach(tr => {
      tr.addEventListener("click", () => openEditForm(Number(tr.dataset.id)));
    });
  }
}

async function loadBookingForm() {
  const [venues, artists, roles, people] = await Promise.all(
    [api("/api/venues"), api("/api/artists"), api("/api/roles"), api("/api/people")]);
  if (venues.ok) {
    document.getElementById("bookVenue").innerHTML =
      venues.body.venues.map(v => `<option value="${v.id}">${v.name}</option>`).join("");
  }
  if (artists.ok) {
    document.getElementById("artistNames").innerHTML =
      artists.body.artists.map(a => `<option value="${a.name}">`).join("");
  }
  if (roles.ok) {
    allRoles = roles.body.roles;
    document.getElementById("staffRole").innerHTML =
      allRoles.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
  }
  if (people.ok) {
    lastPeople = people.body.people;
    const active = lastPeople.filter(p => p.active);
    document.getElementById("staffPerson").innerHTML =
      active.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
  }
}

function renderPeopleTable() {
  const host = document.getElementById("peopleHost");
  if (!lastPeople.length) {
    host.innerHTML = `<div id="empty">No one on the roster yet.</div>`;
    return;
  }
  const rows = lastPeople.map(p => `
    <tr data-id="${p.id}" style="cursor:pointer${p.active ? "" : ";opacity:.55"}">
      <td><strong>${p.name}</strong>${p.active ? "" : " · inactive"}</td>
      <td>${p.email}</td>
      <td>${p.phone || ""}</td>
      <td><span class="pill ${p.access_level === "crew" ? "pill-muted" : ""}">${p.access_level}</span></td>
      <td>${p.roles.map(r => r.name).join(", ")}</td>
    </tr>`).join("");
  host.innerHTML =
    `<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Access</th><th>Covers</th></tr></thead>
     <tbody>${rows}</tbody></table>`;
  host.querySelectorAll("tr[data-id]").forEach(tr => {
    tr.addEventListener("click", () => openPersonForm(Number(tr.dataset.id)));
  });
}

function renderRoleCheckboxes(checkedIds) {
  const host = document.getElementById("pRoles");
  host.innerHTML = allRoles.map(r => `
    <label class="roleChip">
      <input type="checkbox" value="${r.id}" ${checkedIds.includes(r.id) ? "checked" : ""}>
      ${r.name}
    </label>`).join("");
}

function openPersonForm(personId) {
  const p = personId ? lastPeople.find(x => x.id === personId) : null;
  editingPersonId = personId || null;
  const outranked = p && myAccessLevel !== "owner" && p.access_level !== "crew";

  document.getElementById("pName").value = p ? p.name : "";
  document.getElementById("pEmail").value = p ? p.email : "";
  document.getElementById("pEmail").disabled = !!p;  // email isn't editable once created
  document.getElementById("pPhone").value = (p && p.phone) || "";
  document.getElementById("pActive").checked = p ? p.active : true;

  const accessSelect = document.getElementById("pAccess");
  accessSelect.value = p ? p.access_level : "crew";
  // A booker may only grant/see 'crew' as an option, never elevate anyone.
  [...accessSelect.options].forEach(o => {
    o.disabled = myAccessLevel !== "owner" && o.value !== "crew";
  });
  accessSelect.disabled = outranked;

  renderRoleCheckboxes(p ? p.roles.map(r => r.id) : []);
  document.getElementById("pResetBtn").style.display = p ? "inline-block" : "none";
  document.getElementById("pTempPassword").style.display = "none";
  document.getElementById("pError").textContent = outranked
    ? "You don't have permission to edit this person." : "";
  document.getElementById("pName").disabled = !!outranked;
  document.getElementById("pPhone").disabled = !!outranked;
  document.getElementById("pActive").disabled = !!outranked;
  document.getElementById("pSaveBtn").style.display = outranked ? "none" : "inline-block";

  document.getElementById("personForm").style.display = "block";
}

function renderStaffList() {
  const e = lastEvents.find(x => x.id === editingId);
  const staff = (e && e.staff) || [];
  const host = document.getElementById("staffList");
  host.innerHTML = staff.length
    ? staff.map(s => `
        <div class="staffRow">
          <span class="role">${s.role}</span>
          <span>${s.person_name || "(removed person)"}</span>
          <button type="button" data-remove="${s.id}">Remove</button>
        </div>`).join("")
    : `<div style="color:var(--ink-3);font-size:13px">Nobody assigned yet.</div>`;
  host.querySelectorAll("button[data-remove]").forEach(btn => {
    btn.addEventListener("click", async () => {
      await api(`/api/assignments/${btn.dataset.remove}`, {method: "DELETE"});
      await loadEvents();
      renderStaffList();
    });
  });
}

function openEditForm(eventId) {
  const e = lastEvents.find(x => x.id === eventId);
  if (!e || e.version == null) return;  // crew's shape has no version; also just a safety guard
  editingId = e.id;
  editingVersion = e.version;
  document.getElementById("bookVenue").value = e.venue_id;
  document.getElementById("bookBand").value = e.headliner;
  document.getElementById("bookDate").value = e.show_date;
  document.getElementById("bookStatus").innerHTML = `
    <option value="hold1">1st hold</option>
    <option value="hold2">2nd hold</option>
    <option value="hold3">3rd hold</option>
    <option value="confirmed">Confirmed</option>
    <option value="complete">Complete</option>
    <option value="dead">Didn't work out</option>`;
  document.getElementById("bookStatus").value = e.status;
  document.getElementById("bookSubmit").textContent = "Save changes";
  document.getElementById("bookError").textContent = "";
  document.getElementById("bookForm").style.display = "block";
  document.getElementById("staffPanel").style.display = "block";
  renderStaffList();

  const showSettlement = e.status === "complete";
  document.getElementById("settlementPanel").style.display = showSettlement ? "block" : "none";
  if (showSettlement) {
    const s = e.settlement || {};
    document.getElementById("setTickets").value = s.tickets_sold ?? "";
    document.getElementById("setGross").value = s.gross ?? "";
    document.getElementById("setExpenses").value = s.expenses ?? "";
    document.getElementById("setPayout").value = s.artist_payout ?? "";
    document.getElementById("setSettled").checked = !!s.settled;
    document.getElementById("setError").textContent = "";
    updateNetDisplay();
  }
}

function updateNetDisplay() {
  const num = (id) => {
    const v = document.getElementById(id).value;
    return v === "" ? null : Number(v);
  };
  const gross = num("setGross"), expenses = num("setExpenses"), payout = num("setPayout");
  const net = document.getElementById("setNet");
  if (gross === null && expenses === null && payout === null) {
    net.textContent = "";
    return;
  }
  const total = (gross || 0) - (expenses || 0) - (payout || 0);
  net.textContent = `Net to the room: $${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} (gross − expenses − artist payout)`;
}

function switchView(view) {
  currentView = view;
  document.getElementById("calendarView").style.display = view === "calendar" ? "block" : "none";
  document.getElementById("peopleView").style.display = view === "people" ? "block" : "none";
  document.querySelectorAll(".navBtn").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.view === view ? "true" : "false");
  });
  if (view === "people") renderPeopleTable();
}

async function boot() {
  const me = await api("/api/me");
  if (me.ok) {
    document.getElementById("whoami").textContent = `${me.body.name} · ${me.body.access_level}`;
    myAccessLevel = me.body.access_level;
    canBook = myAccessLevel === "booker" || myAccessLevel === "owner";
    document.getElementById("bookBtn").style.display = canBook ? "inline-block" : "none";
    document.getElementById("navTabs").style.display = canBook ? "flex" : "none";
    document.getElementById("addPersonBtn").style.display = canBook ? "inline-block" : "none";
    if (canBook) loadBookingForm();
    showApp();
    switchView("calendar");
    loadEvents();
  } else {
    showLogin();
  }
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const {ok, body} = await api("/api/login", {method: "POST", body: JSON.stringify({email, password})});
  if (ok) { boot(); }
  else { document.getElementById("loginError").textContent = "Wrong email or password."; }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await api("/api/logout", {method: "POST"});
  showLogin();
});

document.getElementById("bookBtn").addEventListener("click", () => {
  editingId = null;
  editingVersion = null;
  document.getElementById("bookForm").reset();
  document.getElementById("bookStatus").innerHTML = `
    <option value="hold1">1st hold</option>
    <option value="hold2">2nd hold</option>
    <option value="hold3">3rd hold</option>
    <option value="confirmed">Confirmed</option>`;
  document.getElementById("bookSubmit").textContent = "Book it";
  document.getElementById("bookError").textContent = "";
  document.getElementById("bookForm").style.display = "block";
  document.getElementById("bookDate").valueAsDate = new Date();
  document.getElementById("staffPanel").style.display = "none";  // no event_id yet to assign against
  document.getElementById("settlementPanel").style.display = "none";
});

document.getElementById("staffAddBtn").addEventListener("click", async () => {
  if (!editingId) return;
  const role_id = Number(document.getElementById("staffRole").value);
  const person_id = Number(document.getElementById("staffPerson").value);
  if (!role_id || !person_id) return;
  const {ok, body} = await api(`/api/events/${editingId}/assignments`, {
    method: "POST", body: JSON.stringify({role_id, person_id}),
  });
  if (ok) {
    await loadEvents();
    renderStaffList();
  } else {
    document.getElementById("bookError").textContent = body.error || "Could not assign that person.";
  }
});
document.getElementById("bookStatus").addEventListener("change", () => {
  if (!editingId) return;  // a brand-new unsaved show has nothing to settle yet
  const showSettlement = document.getElementById("bookStatus").value === "complete";
  document.getElementById("settlementPanel").style.display = showSettlement ? "block" : "none";
  if (showSettlement) updateNetDisplay();
});

["setGross", "setExpenses", "setPayout"].forEach(id => {
  document.getElementById(id).addEventListener("input", updateNetDisplay);
});

document.getElementById("setSaveBtn").addEventListener("click", async () => {
  if (!editingId) return;
  const payload = {
    tickets_sold: document.getElementById("setTickets").value,
    gross: document.getElementById("setGross").value,
    expenses: document.getElementById("setExpenses").value,
    artist_payout: document.getElementById("setPayout").value,
    settled: document.getElementById("setSettled").checked,
  };
  const {ok, body} = await api(`/api/events/${editingId}/settlement`, {method: "PUT", body: JSON.stringify(payload)});
  if (ok) {
    document.getElementById("setError").textContent = "";
    await loadEvents();
  } else {
    document.getElementById("setError").textContent = body.error || "Could not save the finals.";
  }
});

document.getElementById("bookCancel").addEventListener("click", () => {
  document.getElementById("bookForm").style.display = "none";
  document.getElementById("staffPanel").style.display = "none";
  document.getElementById("bookError").textContent = "";
});
document.getElementById("bookForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    venue_id: Number(document.getElementById("bookVenue").value),
    headliner: document.getElementById("bookBand").value,
    show_date: document.getElementById("bookDate").value,
    status: document.getElementById("bookStatus").value,
  };
  let ok, body;
  if (editingId) {
    payload.version = editingVersion;
    ({ok, body} = await api(`/api/events/${editingId}`, {method: "PATCH", body: JSON.stringify(payload)}));
  } else {
    ({ok, body} = await api("/api/events", {method: "POST", body: JSON.stringify(payload)}));
  }
  if (ok) {
    document.getElementById("bookForm").style.display = "none";
    document.getElementById("staffPanel").style.display = "none";
    document.getElementById("settlementPanel").style.display = "none";
    document.getElementById("bookForm").reset();
    document.getElementById("bookError").textContent = "";
    editingId = null;
    editingVersion = null;
    loadEvents();
    loadBookingForm();  // a new band should now appear in the artist datalist
  } else if (body.error === "version_conflict") {
    document.getElementById("bookError").textContent =
      "Someone else changed this show while you had it open. Reload and try again.";
  } else {
    document.getElementById("bookError").textContent = body.error || "Could not save that show.";
  }
});

document.querySelectorAll(".navBtn").forEach(b => {
  b.addEventListener("click", () => switchView(b.dataset.view));
});

document.getElementById("addPersonBtn").addEventListener("click", () => openPersonForm(null));

document.getElementById("pCancelBtn").addEventListener("click", () => {
  document.getElementById("personForm").style.display = "none";
  editingPersonId = null;
});

document.getElementById("pSaveBtn").addEventListener("click", async () => {
  const roleIds = [...document.querySelectorAll("#pRoles input:checked")].map(i => Number(i.value));
  document.getElementById("pError").textContent = "";

  if (editingPersonId) {
    const payload = {
      name: document.getElementById("pName").value,
      phone: document.getElementById("pPhone").value,
      active: document.getElementById("pActive").checked,
      access_level: document.getElementById("pAccess").value,
    };
    const {ok, body} = await api(`/api/people/${editingPersonId}`, {method: "PATCH", body: JSON.stringify(payload)});
    if (!ok) { document.getElementById("pError").textContent = body.error || "Could not save."; return; }
    await api(`/api/people/${editingPersonId}/roles`, {method: "PUT", body: JSON.stringify({role_ids: roleIds})});
  } else {
    const payload = {
      name: document.getElementById("pName").value,
      email: document.getElementById("pEmail").value,
      phone: document.getElementById("pPhone").value,
      access_level: document.getElementById("pAccess").value,
    };
    const {ok, body} = await api("/api/people", {method: "POST", body: JSON.stringify(payload)});
    if (!ok) { document.getElementById("pError").textContent = body.error || "Could not create."; return; }
    editingPersonId = body.id;
    if (roleIds.length) {
      await api(`/api/people/${editingPersonId}/roles`, {method: "PUT", body: JSON.stringify({role_ids: roleIds})});
    }
    const box = document.getElementById("pTempPassword");
    box.style.display = "block";
    box.textContent = `Temp password: ${body.temp_password} — give this to them, they should change it after logging in.`;
  }
  await loadBookingForm();  // refreshes lastPeople and the staff-assign picker
  renderPeopleTable();
  if (!editingPersonId || document.getElementById("pTempPassword").style.display === "none") {
    document.getElementById("personForm").style.display = "none";
  }
});

document.getElementById("pResetBtn").addEventListener("click", async () => {
  if (!editingPersonId) return;
  const {ok, body} = await api(`/api/people/${editingPersonId}/reset-password`, {method: "POST"});
  const box = document.getElementById("pTempPassword");
  if (ok) {
    box.style.display = "block";
    box.textContent = `New temp password: ${body.temp_password} — give this to them, they should change it after logging in.`;
  } else {
    document.getElementById("pError").textContent = body.error || "Could not reset password.";
  }
});

boot();
</script>
</body>
</html>
