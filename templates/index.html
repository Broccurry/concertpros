/* after a task/staff/settlement action, reload real data and re-open the
   same show so the sheet reflects the server, not a locally-guessed state */
/* Fields the user edits in-place and that autosave may not have flushed
   yet (it's debounced ~900ms behind typing) — a task/staff/settlement
   action must not silently wipe these out from under them mid-edit. */
var UNSAVED_FIELDS = ["venue_id","artists","show_date","doors","show_time",
  "status","deal_type","guarantee","backend_pct","deal_notes","ticket_tiers",
  "announce_date","onsale_date","notes","ticket_link"];

async function refreshDraft(){
  var id = draft.id;
  var pending = {};
  UNSAVED_FIELDS.forEach(function(k){ pending[k] = draft[k]; });
  await loadEvents();
  await loadBookerLookups();
  var fresh = JSON.parse(JSON.stringify(eventById(id)));
  draft = Object.assign(fresh, pending);  // tasks/staff/settlement/version come from the server; everything still-unsaved survives
  renderSheet();
}

/* Every date from start to end inclusive — the "select multiple dates"
   shortcut for a multi-day hold, so a five-night run doesn't mean five
   individual add-a-date clicks. */
function datesInRange(start, end){
  if(!start || !end) return [];
  var out = [], p1 = parts(start), p2 = parts(end);
  var d = new Date(p1.y, p1.m, p1.d), last = new Date(p2.y, p2.m, p2.d);
  if(d > last) return [];
  while(d <= last){
    out.push(iso(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
async function addHoldDates(dates){
  dates = dates.filter(function(d){ return d; });
  if(!dates.length) return;
  if(draftIsNew){
    draft.extraDates = (draft.extraDates||[]).concat(dates);
    renderSheet();
  } else {
    await api("/api/events/" + draft.id + "/hold_dates", {method:"POST", body: JSON.stringify({dates:dates})});
    await refreshDraft();
  }
}
async function updateHoldDateStatus(eventId, newStatus, version){
  var r = await api("/api/events/" + eventId, {method:"PATCH", body: JSON.stringify({status:newStatus, version:version})});
  if(!r.ok){
    window.alert(r.body.error === "version_conflict" ? "Someone else changed that date. Reloading." : (r.body.error || "Could not save."));
    await refreshDraft();
    return;
  }
  if(newStatus === "confirmed"){
    // Confirming collapses the whole group — the id we just confirmed is
    // the only one guaranteed to still exist, so reopen fresh on it
    // rather than trying to guess whether draft.id survived.
    await loadEvents();
    await loadBookerLookups();
    await openEvent(eventId);
  } else {
    await refreshDraft();
  }
}

// One upload path shared by the general Files tab and a show's own Files
// section — both just call this with a different event_id, so there's no
// second, slightly different upload flow to drift out of sync with this
// one. The app never proxies the bytes: the browser PUTs straight to the
// presigned B2 URL the backend hands back.
async function uploadFile(file, eventId){
  var r = await api("/api/files/upload-url", {method:"POST", body: JSON.stringify({
    filename: file.name, content_type: file.type || "application/octet-stream",
    size_bytes: file.size, event_id: eventId || null,
  })});
  if(!r.ok) return false;
  try {
    var put = await fetch(r.body.upload_url, {
      method: "PUT", body: file, headers: {"Content-Type": file.type || "application/octet-stream"},
    });
    if(put.ok) return true;
  } catch(err){ /* network/CORS failure — fall through to cleanup below */ }
  // The DB row was already created so the file would show up with nothing
  // actually in B2 behind it — clean that up rather than leaving a dead link.
  await api("/api/files/" + r.body.id, {method:"DELETE"});
  return false;
}
function humanFileSize(bytes){
  if(bytes == null) return "";
  var units = ["B","KB","MB","GB"], n = bytes, i = 0;
  while(n >= 1024 && i < units.length - 1){ n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + " " + units[i];
}
// Presigned download URLs expire in 5 minutes (storage.DOWNLOAD_URL_TTL) --
// cached shorter than that so a thumbnail never goes stale while visible,
// and a fresh one is fetched next render instead of failing silently.
var THUMB_CACHE = {};
function fileThumb(f){
  var img = el("img","filethumb");
  img.alt = "";
  var cached = THUMB_CACHE[f.id];
  if(cached && Date.now() - cached.at < 4 * 60 * 1000){
    img.src = cached.url;
  } else {
    img.classList.add("filethumb-loading");
    api("/api/files/" + f.id + "/download-url").then(function(r){
      if(!r.ok) return;
      THUMB_CACHE[f.id] = {url: r.body.url, at: Date.now()};
      img.src = r.body.url;
      img.classList.remove("filethumb-loading");
    });
  }
  return img;
}

// One upload control, used both here and in a show's own Files section —
// the failure handling (a failed upload gets alerted, not silently
// dropped) lives here once instead of being copied at each call site.
function fileUploadInput(eventId, onDone){
  var inp = document.createElement("input");
  inp.type = "file"; inp.multiple = true; inp.className = "btn";
  inp.onchange = async function(){
    var chosen = Array.prototype.slice.call(inp.files || []);
    inp.disabled = true;
    var failed = 0;
    for(var i = 0; i < chosen.length; i++){ if(!(await uploadFile(chosen[i], eventId))) failed++; }
    inp.disabled = false;
    inp.value = "";
    if(failed){
      window.alert(failed + " of " + chosen.length + " file" + (chosen.length === 1 ? "" : "s") +
        " failed to upload. Check your connection and try again.");

async function refreshFiles(){
  var r = await api("/api/files");
  if(r.ok) store.files = r.body.files;
  renderAll();
}
// A folder is just "this confirmed-or-later show's files" — derived from
// the event's own status, not a separate thing to create/track, so a show
// getting a folder the moment it's confirmed falls out for free instead
// of needing its own trigger to keep in sync.
function foldersEvents(){
  return (store.events||[]).filter(function(e){ return e.status === "confirmed" || e.status === "complete"; })
    .slice().sort(function(a,b){ return a.show_date < b.show_date ? -1 : a.show_date > b.show_date ? 1 : 0; });
}
// M-D-YY, date first so folders already read in date order at a glance —
// same idea as naming a file "2026-05-01" instead of "May 1st file".
function folderDateLabel(s){
  var p = parts(s);
  return (p.m + 1) + "-" + p.d + "-" + String(p.y).slice(-2);
}
function headlinerName(ev){
  var acts = ev.artists || [];
  return acts.length ? acts[0].name : "Untitled hold";
}
function folderLabel(ev){
  return folderDateLabel(ev.show_date) + " " + headlinerName(ev) + " " + ev.venue;
}
function renderFolder(host, key, label, eventId){
  var files = (store.files||[]).filter(function(f){ return f.event_id === eventId; });
  var det = document.createElement("details");
  det.className = "folder";
  det.open = !!ui.openFolders[key];
  det.addEventListener("toggle", function(){
    ui.openFolders[key] = det.open;
    // One show folder open at a time -- there can be 80+ of these in a
    // year, and they piling up open was Broc's exact complaint.
    if(det.open){
      document.querySelectorAll(".folder").forEach(function(other){
        if(other !== det && other.open){
          other.open = false;
          ui.openFolders[other.dataset.folderKey] = false;
        }
      });
    }
  });
  det.dataset.folderKey = key;
  var sum = document.createElement("summary");

/* ============================== vision board ============================ */
// Plain functional column names — the "Vision Board" name itself already
// carries the aspirational framing, the columns just track how far an
// idea has moved toward becoming a real booked show.
// Two separate boards, same underlying vision_cards table — which board a
// column belongs to is fixed here, in the one place, so a card's stage
// always implies exactly one board and never disagrees with itself.
var VISION_COLUMNS = [{key:"idea", label:"Idea"}];
var PROGRESS_COLUMNS = [{key:"in_progress", label:"In Progress"}];
var MAO_COLUMNS = [{key:"offer_sent", label:"Offer Sent"}];
var ALL_VISION_COLUMNS = VISION_COLUMNS.concat(PROGRESS_COLUMNS).concat(MAO_COLUMNS);
function visionCardsByColumn(key){
  return (store.visionCards||[]).filter(function(c){ return c.column_key === key; })
    .slice().sort(function(a,b){ return a.sort_order - b.sort_order; });
}
// Every board on this page at once, stacked, rather than a switcher that
// hides all but one — this IS the Vision Board space, boards are sections
// on it, not separate screens. New boards get added here in code as
// they're actually needed — building a generic "create a board" UI would
// be speculative complexity for what is, in practice, a couple of boards
// Broc and his bookers decide on together every few months.
var BOARDS = [
  {key:"vision", label:"Ideas", columns: VISION_COLUMNS,
   emptyHint:"Post an idea below — a band to chase, whatever's worth not forgetting."},
  {key:"progress", label:"In Progress", columns: PROGRESS_COLUMNS,
   emptyHint:"Drag a card here once it's more than just an idea — someone's actively working it."},
  {key:"mao", label:"MAO", columns: MAO_COLUMNS,
   emptyHint:"Log an outreach below once you've actually reached out to someone."},
];
function renderVisionBoard(){
  var host = document.getElementById("view-vision");
  host.innerHTML = "";

  var row = el("div","boardsrow");
  host.appendChild(row);
  BOARDS.forEach(function(b){
    var group = el("div","boardgroup");
    group.appendChild(el("h3","section", b.label));
    var boardHost = el("div");
    group.appendChild(boardHost);
    row.appendChild(group);
    renderCardBoard(boardHost, b.columns, b.emptyHint);
  });
}
function renderCardBoard(host, columns, emptyHint){

  var anyCards = columns.some(function(col){ return visionCardsByColumn(col.key).length; });
  if(!anyCards){
    var e = el("div","empty");
    e.appendChild(el("h3",null,"Nothing here yet"));
    e.appendChild(el("p",null,emptyHint));
    host.appendChild(e);
  }

  var board = el("div","visionboard");
  columns.forEach(function(col){
    var colEl = el("div","visioncol");
    colEl.dataset.columnKey = col.key;
    // A single-column board's name already says what the column is — a
    // repeated label under it (e.g. "MAO" board showing an "Offer Sent"
    // header on its only column) is the exact redundancy Broc flagged.
    if(columns.length > 1) colEl.appendChild(el("h3","visioncol-head", col.label));

    var quickAdd = document.createElement("input");
    quickAdd.type = "text";
    quickAdd.placeholder = "+ Add a card";
    quickAdd.className = "visioncol-quickadd";
    quickAdd.onkeydown = async function(e){
      if(e.key !== "Enter") return;
      var title = quickAdd.value.trim();
      if(!title) return;
      e.preventDefault();
      await api("/api/vision_cards", {method:"POST", body: JSON.stringify({title:title, column_key:col.key})});
      await loadBookerLookups();
      renderAll();
    };
    colEl.appendChild(quickAdd);

    var wrap = el("div","visioncol-notes");
    colEl.appendChild(wrap);

    visionCardsByColumn(col.key).forEach(function(c){
      var card = el("div","visioncard");
      card.dataset.cardId = c.id;
      var grip = el("span","visioncard-grip","⠿");
      grip.title = "Drag to move";
      var dragState = null;
      grip.addEventListener("pointerdown", function(e){
        e.preventDefault();
        grip.setPointerCapture(e.pointerId);
        dragState = {cardId: c.id, startY: e.clientY, startX: e.clientX};
        card.classList.add("visioncard-dragging");
      });
      grip.addEventListener("pointermove", function(e){
        if(!dragState) return;
        card.style.transform = "translate(" + (e.clientX - dragState.startX) + "px," + (e.clientY - dragState.startY) + "px)";
        card.style.zIndex = "10";
      });
      function endDrag(e){
        if(!dragState) return;
        card.style.transform = ""; card.style.zIndex = "";
        card.classList.remove("visioncard-dragging");
        var from = dragState; dragState = null;

        // Which column is the pointer over? Search every board on the page,
        // not just this card's own board -- a card can be dragged from
        // Ideas straight into In Progress or MAO, same gesture either way.
        var cols = Array.prototype.slice.call(document.querySelectorAll("#view-vision .visioncol"));
        var targetCol = cols.find(function(ce){
          var r = ce.getBoundingClientRect();
          return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        }) || card.closest(".visioncol");
        var targetKey = targetCol.dataset.columnKey;
        var siblings = Array.prototype.slice.call(targetCol.querySelectorAll(".visioncard"));
        var targetIdx = siblings.length;
        for(var i = 0; i < siblings.length; i++){
          if(siblings[i] === card) continue;
          var rect = siblings[i].getBoundingClientRect();
          if(e.clientY < rect.top + rect.height / 2){ targetIdx = i; break; }
        }
        moveVisionCard(from.cardId, targetKey, targetIdx);
      }
      grip.addEventListener("pointerup", endDrag);
      grip.addEventListener("pointercancel", endDrag);
      card.appendChild(grip);

      var body = el("div","visioncard-body");
      body.onclick = function(){ openVisionCardForm(c.id); };
      body.appendChild(el("p","visioncard-title", c.title));
      if(c.artist_name) body.appendChild(el("span","pill s-complete", c.artist_name));
      if(c.venue_name) body.appendChild(el("span","pill pill-muted", c.venue_name));
      if(c.trigger_event_id){
        body.appendChild(el("p","hint",
          "From " + shortDate(c.trigger_show_date) + " · " + c.trigger_venue));
      }
      if(c.follow_up_date){
        var due = c.follow_up_date <= todayISO();
        var fuText = "Follow up " + shortDate(c.follow_up_date) + (c.follow_up_person_name ? " · " + c.follow_up_person_name : "");
        body.appendChild(el("p", due ? "hint vision-followup-due" : "hint", fuText));
      }
      card.appendChild(body);
      wrap.appendChild(card);
    });

    board.appendChild(colEl);
  });
  host.appendChild(board);
}
async function moveVisionCard(cardId, columnKey, index){
  var ids = visionCardsByColumn(columnKey).map(function(c){ return c.id; }).filter(function(id){ return id !== cardId; });
  ids.splice(index, 0, cardId);
  await api("/api/vision_cards/reorder", {method:"POST", body: JSON.stringify({column_key: columnKey, card_ids: ids})});
  await loadBookerLookups();
  renderAll();
}

  fsRoles.appendChild(el("legend",null,"Roles they cover"));
  var pick = el("div","rolepick");
  store.roles.forEach(function(r){
    var b = el("button","chip", r.name);
    b.type = "button";
    b.setAttribute("aria-pressed", draftP.roles.indexOf(r.id) >= 0 ? "true" : "false");
    b.onclick = function(){
      var i = draftP.roles.indexOf(r.id);
      if(i >= 0) draftP.roles.splice(i,1); else draftP.roles.push(r.id);
      b.setAttribute("aria-pressed", draftP.roles.indexOf(r.id) >= 0 ? "true" : "false");
    };
    pick.appendChild(b);
  });
  fsRoles.appendChild(pick);
  body.appendChild(fsRoles);

  if(outranked) body.appendChild(el("p","hint","You don't have permission to edit this person."));

  var errLine = el("span","hint"); errLine.style.color = "var(--dead)";
  if(!outranked){
    var save = el("button","btn btn-primary","Save");
    save.onclick = async function(){
      errLine.textContent = "";
      if(!p){
        var r = await api("/api/people", {method:"POST", body: JSON.stringify({
          name: draftP.name, email: draftP.email, phone: draftP.phone, access_level: draftP.access_level})});
        if(!r.ok){ errLine.textContent = r.body.error || "Could not create."; return; }
        if(draftP.roles.length) await api("/api/people/" + r.body.id + "/roles", {method:"PUT", body: JSON.stringify({role_ids: draftP.roles})});
        await loadBookerLookups();
        window.alert("Temp password: " + r.body.temp_password + "\n\nGive this to them — they should change it after logging in.");
        closeSheet();
        renderAll();
      } else {
        var r2b = await api("/api/people/" + p.id, {method:"PATCH", body: JSON.stringify({
          name: draftP.name, phone: draftP.phone, active: draftP.active, access_level: draftP.access_level})});
        if(!r2b.ok){ errLine.textContent = r2b.body.error || "Could not save."; return; }
        await api("/api/people/" + p.id + "/roles", {method:"PUT", body: JSON.stringify({role_ids: draftP.roles})});
        await loadBookerLookups();
        closeSheet();
        renderAll();
      }
    };
    foot.appendChild(save);
  }
  var cancel = el("button","btn","Cancel");
  cancel.onclick = closeSheet;
  foot.appendChild(cancel);
  foot.appendChild(errLine);
  if(p && !outranked && p.id !== me.id){
    foot.appendChild(el("div","spacer"));
    var resetBtn = el("button","btn","Reset password");
    resetBtn.title = "Generates a new temp password for them to log in with";
    resetBtn.onclick = async function(){
      var r = await api("/api/people/" + p.id + "/reset-password", {method:"POST"});
      if(r.ok) window.alert("New temp password: " + r.body.temp_password);
      else errLine.textContent = r.body.error || "Could not reset password.";
    };
    foot.appendChild(resetBtn);
  } else if(p && p.id === me.id){
    foot.appendChild(el("div","spacer"));
    foot.appendChild(el("span","hint","To change your own password, use Settings → Password."));
  }
  openScrim();
}

/* ============================== settings ============================== */
function currentTheme(){
  try{
    var t = localStorage.getItem("cp_theme");
    return (t === "light" || t === "dark") ? t : "system";
  }catch(e){ return "system"; }
}
function setTheme(theme){
  if(theme === "light" || theme === "dark"){
    document.documentElement.setAttribute("data-theme", theme);
    try{ localStorage.setItem("cp_theme", theme); }catch(e){}
  } else {
    document.documentElement.removeAttribute("data-theme");
    try{ localStorage.removeItem("cp_theme"); }catch(e){}
  }
  renderSettingsView();
}
function renderSettingsView(){
  var host = document.getElementById("view-settings");
  host.innerHTML = "";
  var fs = document.createElement("fieldset");
  fs.appendChild(el("legend",null,"Appearance"));
  var grid = el("div","statusgrid");
  var active = currentTheme();
  [["system","Match device"],["light","Light"],["dark","Dark"]].forEach(function(opt){
    var b = el("button","statusopt", opt[1]);
    b.type = "button";
    b.setAttribute("aria-pressed", active === opt[0] ? "true" : "false");
    b.onclick = function(){ setTheme(opt[0]); };
    grid.appendChild(b);
  });
  fs.appendChild(grid);
  fs.appendChild(el("p","hint","Dark and Light stay picked on this device regardless of your system setting. Match device follows whatever your phone or computer is set to."));
  host.appendChild(fs);

  var fsPw = document.createElement("fieldset");
  fsPw.appendChild(el("legend",null,"Password"));
  var curPwInput = input("password", "", function(){});
  curPwInput.autocomplete = "current-password";
  var newPwInput = input("password", "", function(){});
  newPwInput.autocomplete = "new-password";
  var pwRow = el("div","row-narrow");
  pwRow.appendChild(field("Current password", curPwInput));
  pwRow.appendChild(field("New password", newPwInput));
  fsPw.appendChild(pwRow);
  var pwMsg = el("p","hint","At least 8 characters.");
  fsPw.appendChild(pwMsg);
  var pwBtn = el("button","btn","Change password");
  pwBtn.type = "button";
  pwBtn.onclick = async function(){
    pwBtn.disabled = true;
    var r = await api("/api/change-password", {method:"POST", body: JSON.stringify({
      current_password: curPwInput.value, new_password: newPwInput.value,
    })});
    pwBtn.disabled = false;
    if(r.ok){
      curPwInput.value = ""; newPwInput.value = "";
      pwMsg.textContent = "Password changed.";
      pwMsg.style.color = "var(--confirm)";
    } else {
      pwMsg.textContent = r.body.error === "wrong_current_password" ? "Current password is wrong."
        : r.body.error === "password_too_short" ? "New password needs at least 8 characters."
        : "Could not change the password.";
      pwMsg.style.color = "var(--dead)";
    }
  };
  fsPw.appendChild(pwBtn);
  host.appendChild(fsPw);

  if(canBook()){
    var fsPeople = document.createElement("fieldset");
    fsPeople.appendChild(el("legend",null,"People"));
    fsPeople.appendChild(el("p","hint","Create accounts, set access level, and manage who covers which job role."));
    var goPeople = el("button","btn btn-primary","Manage people");
    goPeople.type = "button";
    goPeople.onclick = function(){ ui.view = "people"; setActiveTab(); renderAll(); };
    fsPeople.appendChild(goPeople);
    host.appendChild(fsPeople);
  }
}

/* ============================== boot =================================== */
function renderMentionsBadge(){
  var wrap = document.getElementById("mentionsWrap");
  if(!canBook()){ wrap.style.display = "none"; return; }
  wrap.style.display = "inline-flex";
  var total = (me.mention_count||0) + (me.followup_count||0);
  document.getElementById("mentionsCount").textContent = total ? String(total) : "";
  document.getElementById("mentionsBtn").classList.toggle("has-mentions", !!total);
}
async function refreshMentions(){
  var r = await api("/api/me");
  if(r.ok){ me.mention_count = r.body.mention_count; me.followup_count = r.body.followup_count; }
  renderMentionsBadge();
}
async function toggleMentionsPop(){
  var pop = document.getElementById("mentionsPop");
  if(!pop.hidden){ pop.hidden = true; return; }
  var [rm, rf] = await Promise.all([api("/api/my_mentions"), api("/api/my_followups")]);
  pop.innerHTML = "";
  var mentions = rm.ok ? rm.body.mentions : [];
  var followups = rf.ok ? rf.body.followups : [];
  if(!mentions.length && !followups.length){
    pop.appendChild(el("p","hint","Nothing new."));
  } else {
    mentions.forEach(function(m){
      var item = el("button","mentionitem");
      item.type = "button";
      item.appendChild(el("div","mentionitem-head", (m.from_name||"Someone") + " on " + shortDate(m.show_date) + " · " + m.venue));
      item.appendChild(el("p","mentionitem-body", m.body));
      item.onclick = async function(){
        pop.hidden = true;
        await openEvent(m.event_id);
        await refreshMentions();
      };
      pop.appendChild(item);
    });
    followups.forEach(function(f){
      var item = el("button","mentionitem");
      item.type = "button";
      var when = f.follow_up_date < todayISO() ? "Overdue since " + shortDate(f.follow_up_date) : "Due " + shortDate(f.follow_up_date);
      item.appendChild(el("div","mentionitem-head", "Follow up · " + when));
      item.appendChild(el("p","mentionitem-body", f.title + (f.artist_name ? " · " + f.artist_name : "")));
      item.onclick = function(){
        pop.hidden = true;
        ui.view = "vision"; setActiveTab(); renderAll();
        openVisionCardForm(f.id);
      };
      pop.appendChild(item);
    });
  }
  pop.hidden = false;
}

async function boot(){
  var r = await api("/api/me");
  if(!r.ok){ document.getElementById("loginCard").style.display = "flex"; document.getElementById("app").style.display = "none"; return; }
  me = r.body;
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("whoami").textContent = me.name + " · " + me.access_level;
  renderMentionsBadge();
  document.getElementById("navTabs").style.display = "flex";
  document.getElementById("bookBtn").style.display = canBook() ? "inline-block" : "none";
  document.getElementById("filterbar").style.display = "flex";
  if(!canBook()){
    // Crew gets the calendar, their own to-dos, and their theme
    // preference — booking, staffing, and admin views are booker/owner-
    // only screens.
    document.querySelectorAll("#navTabs button").forEach(function(b){
      if(["calendar","todo","settings"].indexOf(b.dataset.view) < 0) b.remove();
    });
  }
  await loadBookerLookups();
  await loadTodos();
  await loadEvents();
}

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  var r = await api("/api/login", {method:"POST", body: JSON.stringify({email:email, password:password})});
  if(r.ok) boot();
  else document.getElementById("loginError").textContent = r.body.error === "too_many_attempts"
    ? "Too many attempts. Try again in about a minute."
    : "Wrong email or password.";
});
document.getElementById("logoutBtn").addEventListener("click", async function(){
  await api("/api/logout", {method:"POST"});
  document.getElementById("app").style.display = "none";
  document.getElementById("loginCard").style.display = "flex";
});
document.getElementById("navTabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-view]");
  if(!b) return;
  ui.view = b.dataset.view;
  setActiveTab();
  renderAll();
});
function goToPrevMonth(){ ui.cursor.m--; if(ui.cursor.m<0){ui.cursor.m=11;ui.cursor.y--;} renderAll(); }
function goToNextMonth(){ ui.cursor.m++; if(ui.cursor.m>11){ui.cursor.m=0;ui.cursor.y++;} renderAll(); }
document.getElementById("prevMonth").addEventListener("click", goToPrevMonth);
document.getElementById("nextMonth").addEventListener("click", goToNextMonth);
document.getElementById("todayBtn").addEventListener("click", function(){ var t=new Date(); ui.cursor={y:t.getFullYear(),m:t.getMonth()}; renderAll(); });
document.getElementById("showDeadToggle").addEventListener("change", function(e){ ui.showDead = e.target.checked; renderAll(); });
document.getElementById("bookBtn").addEventListener("click", function(){ openEvent(null, todayISO()); });
document.getElementById("calSearchInput").addEventListener("input", function(e){ renderCalSearchResults(e.target.value); });
document.addEventListener("click", function(e){
  var wrap = document.getElementById("calSearchWrap");
  if(!wrap.contains(e.target)) document.getElementById("calSearchResults").hidden = true;
});
document.getElementById("addPersonBtn").addEventListener("click", function(){ openPersonForm(null); });
document.getElementById("mentionsBtn").addEventListener("click", toggleMentionsPop);
document.addEventListener("click", function(e){
  var wrap = document.getElementById("mentionsWrap");
  if(!wrap.contains(e.target)) document.getElementById("mentionsPop").hidden = true;
});
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.getElementById("scrim").addEventListener("click", function(e){ if(e.target === document.getElementById("scrim")) closeSheet(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !document.getElementById("scrim").hidden) closeSheet(); });

/* Scrolling past the top/bottom of the page while on the calendar moves a
   month, so a mouse wheel becomes a quick way to flip months without
   reaching for the arrow buttons. One flip per gesture — wheel fires many
   events per scroll, so a short cooldown stops it jumping several months. */
var lastMonthWheelAt = 0;
window.addEventListener("wheel", function(e){
  if(ui.view !== "calendar" || !document.getElementById("scrim").hidden) return;
  var atBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 2);
  var atTop = window.scrollY <= 0;
  var now = Date.now();
  if(now - lastMonthWheelAt < 700) return;
  if(e.deltaY > 0 && atBottom){ lastMonthWheelAt = now; goToNextMonth(); }
  else if(e.deltaY < 0 && atTop){ lastMonthWheelAt = now; goToPrevMonth(); }
}, {passive:true});
if(phoneMQ){ if(phoneMQ.addEventListener) phoneMQ.addEventListener("change", renderAll); else if(phoneMQ.addListener) phoneMQ.addListener(renderAll); }

boot();
})();
</script>
