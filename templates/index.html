<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConcertPro</title>
<script>
// Applied before first paint so switching themes never flashes the old one.
(function(){
  try{
    var t = localStorage.getItem("cp_theme");
    if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#16181d; --ink-2:#3d434f; --ink-3:#6b7382;
  --ground:#f2f3f6; --surface:#fff; --surface-2:#e9ebf0;
  --line:#d5d9e2; --line-strong:#b4bac7;
  --accent:#2a3d8f; --accent-soft:#e6e9f6;
  --hold-1:#b26a00; --hold-1-bg:#f6b73c; --hold-2-bg:#fbdfa4; --hold-3-bg:#fdf1d8;
  --confirm:#1c6b45; --confirm-bg:#c9ecd8;
  --done:#4a5262; --done-bg:#dde1e9;
  --dead:#9a3b3b; --dead-bg:#f0dada;
  --openslot:#6b3fa0; --openslot-bg:#efe4f8;
  --shadow:0 1px 2px rgba(20,24,35,.08), 0 8px 24px rgba(20,24,35,.06);
  --radius:6px;
  --display:"Oswald","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9ebf1; --ink-2:#b3b9c7; --ink-3:#848c9d;
    --ground:#14161b; --surface:#1d2027; --surface-2:#272b34;
    --line:#333846; --line-strong:#49505f; --accent:#8fa3f0; --accent-soft:#232a44;
    --hold-1:#2a1e05; --hold-1-bg:#d99a2b; --hold-2-bg:#6b5323; --hold-3-bg:#3a3222;
    --confirm:#b9f0d2; --confirm-bg:#1d4634; --done:#c3cad8; --done-bg:#333948;
    --dead:#f2c2c2; --dead-bg:#4d2b2b;
    --openslot:#c7a3ec; --openslot-bg:#372a4a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
/* A manually-picked theme (Settings tab) overrides the system preference
   either direction — same variable values as the media query above,
   just gated on data-theme instead of prefers-color-scheme. */
:root[data-theme="dark"]{
  --ink:#e9ebf1; --ink-2:#b3b9c7; --ink-3:#848c9d;
  --ground:#14161b; --surface:#1d2027; --surface-2:#272b34;
  --line:#333846; --line-strong:#49505f; --accent:#8fa3f0; --accent-soft:#232a44;
  --hold-1:#2a1e05; --hold-1-bg:#d99a2b; --hold-2-bg:#6b5323; --hold-3-bg:#3a3222;
  --confirm:#b9f0d2; --confirm-bg:#1d4634; --done:#c3cad8; --done-bg:#333948;
  --dead:#f2c2c2; --dead-bg:#4d2b2b;
  --openslot:#c7a3ec; --openslot-bg:#372a4a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* Every plain text-entry control is a "white box": hard-coded white/black
   regardless of theme, same fix and same reason as #loginCard's inputs —
   `color:inherit` above was pulling in --ink, which in dark mode is a
   pale color meant for a DARK surface, rendered on these controls'
   actual white background. color-scheme:light also pins a phone's
   native date/time picker digits to light, since those follow the OS's
   own dark-mode setting rather than this CSS. A component with its own
   deliberate on-brand styling (e.g. .taskitem's borderless inline
   inputs) overrides this by using a more specific selector, same as it
   always did. */
input:not([type=checkbox]):not([type=radio]):not([type=range]),
select, textarea{background:#fff;color:#111;color-scheme:light}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.brand{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.02em;margin:0}
.brand span{color:var(--accent)}

#loginCard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;
           width:320px;box-shadow:var(--shadow);margin:80px auto}
#loginCard h1{font-size:24px;text-align:center;margin-bottom:20px}
#loginCard label{display:block;font-size:12px;color:var(--ink-3);margin:12px 0 4px}
/* Plain white/black regardless of theme — simplest fix, and matches what
   most browsers force anyway once a saved password gets autofilled here
   (autofill's own background can't reliably be overridden, so fighting
   it with the dark theme's colors left light text on autofill's white). */
#loginCard input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;
                  background:#fff;color:#111;color-scheme:light}
#loginCard input:-webkit-autofill,
#loginCard input:-webkit-autofill:hover,
#loginCard input:-webkit-autofill:focus{
  -webkit-text-fill-color:#111;
  -webkit-box-shadow:0 0 0px 1000px #fff inset;
  box-shadow:0 0 0px 1000px #fff inset;
}
#loginCard button{width:100%;margin-top:18px;padding:10px;border:0;border-radius:6px;
                   background:var(--accent);color:#fff;font-size:14px;font-weight:600}
#loginError{color:var(--dead);font-size:12.5px;margin-top:10px;min-height:1em}

#app{display:none}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:10px;
              display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .brand{font-size:22px;line-height:1;white-space:nowrap}
.views{display:flex;gap:2px;background:var(--surface-2);padding:2px;border-radius:var(--radius)}
.views button{border:0;background:transparent;color:var(--ink-3);padding:5px 12px;border-radius:4px;font-size:13px;font-weight:500}
.views button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1 1 auto}
.who{color:var(--ink-3);font-size:13px;white-space:nowrap}

.monthnav{display:flex;align-items:center;gap:6px}
.monthnav h2{font-family:var(--display);font-weight:500;font-size:19px;text-transform:uppercase;
             letter-spacing:.03em;margin:0;min-width:170px;text-align:center}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;padding:0;border:1px solid var(--line);
          background:var(--surface);border-radius:var(--radius);color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;
     border-radius:var(--radius);font-size:13px;font-weight:500}
.btn:hover{border-color:var(--line-strong)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-danger{color:var(--dead);border-color:var(--line)}

.filterbar{border-bottom:1px solid var(--line);background:var(--surface)}
.filterbar-inner{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:8px;
                 display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink-2);padding:3px 10px;
      border-radius:999px;font-size:12.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-left:auto}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.swatch{width:11px;height:11px;border-radius:2px;flex:none}
.showdead-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap;cursor:pointer}
.showdead-toggle input{width:auto}

main{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}

.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow div{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:2px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-height:116px;
      padding:5px;display:flex;flex-direction:column;gap:4px;position:relative}
.cell.out{background:transparent;border-style:dashed;opacity:.55}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell-head{display:flex;align-items:center;justify-content:space-between;gap:4px}
.daynum{font-family:var(--display);font-size:14px;font-weight:500;color:var(--ink-2);line-height:1}
.cell.today .daynum{color:var(--accent);font-weight:600}
.addday{opacity:0;border:0;background:transparent;color:var(--ink-3);font-size:16px;line-height:1;padding:0 3px;border-radius:3px}
.cell:hover .addday,.addday:focus-visible{opacity:1}
.addday:hover{background:var(--surface-2);color:var(--ink)}

.show{position:relative;text-align:left;border:1px solid transparent;border-radius:4px;padding:3px 5px;display:block;width:100%;
      font-size:12px;line-height:1.25;overflow:hidden}
.show .name{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.show .meta{display:block;font-size:10.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
/* All three hold tiers are one shade — the priority order is shown as a
   number badge (holdnum), not by fading the color, so 1st/2nd/3rd stay
   equally legible instead of 3rd hold nearly disappearing. */
.s-hold1,.s-hold2,.s-hold3{background:var(--hold-1-bg);color:var(--hold-1);border-color:var(--hold-1-bg)}
.holdnum{position:absolute;top:2px;right:3px;width:14px;height:14px;border-radius:50%;
         background:var(--surface);color:var(--ink);font-size:9.5px;font-weight:700;
         display:grid;place-items:center;line-height:1}
.s-confirmed{background:var(--confirm-bg);color:var(--confirm);border-color:var(--confirm-bg)}
.s-complete{background:var(--done-bg);color:var(--done);border-color:var(--done-bg)}
.s-dead{background:var(--dead-bg);color:var(--dead);border-color:var(--dead-bg)}
.s-dead .name{text-decoration:line-through}
.s-unsettled{background:var(--done-bg);color:var(--done);border-color:var(--hold-1-bg);box-shadow:inset 0 0 0 1px var(--hold-1-bg)}

.cell-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);min-height:58px;
          padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;color:inherit;text-align:center}
.cell-btn.out{background:transparent;border-style:dashed;opacity:.5}
.cell-btn.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell-btn .daynum{font-size:13px}
.cell-btn.today .daynum{color:var(--accent);font-weight:600}
.cell-btn.free .daynum{color:var(--ink-3);font-weight:400}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;min-height:8px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot-more{font-size:9px;color:var(--ink-3);line-height:1;font-variant-numeric:tabular-nums}
.daylist{display:flex;flex-direction:column;gap:6px}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:900px}
th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);
   padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.date-col{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill-muted{background:var(--ground);color:var(--ink-3)}
.title-cell{font-weight:600}
.sub{font-size:11.5px;color:var(--ink-3)}

.taskbar{display:flex;align-items:center;gap:6px;min-width:96px}
.taskbar-track{flex:1;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;min-width:44px}
.taskbar-fill{height:100%;background:var(--accent);border-radius:2px}
.taskbar-num{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

#empty,.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin:0 0 6px}
h3.section{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.05em;margin:24px 0 8px;color:var(--ink-2)}
h3.section:first-child{margin-top:0}

.scrim{position:fixed;inset:0;background:rgba(12,14,20,.55);z-index:50;display:flex;align-items:flex-start;
       justify-content:center;padding:16px;overflow-y:auto}
.sheet{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:100%;max-width:1500px;
       margin:auto;border:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
            position:sticky;top:0;background:var(--surface);border-radius:10px 10px 0 0;z-index:2}
.sheet-head h2{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.sheet-body{padding:18px}
.sheet-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);
            position:sticky;bottom:0;background:var(--surface);border-radius:0 0 10px 10px}

fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:0;margin-bottom:8px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* Fixed, content-sized columns with justify-content:start rather than
   1fr — a date/time/venue value is short, and 1fr was stretching each
   one to a quarter of a very wide modal, leaving a wall of empty white
   box to the right of "07:00 PM". */
.row-4{display:grid;grid-template-columns:repeat(4,minmax(120px,190px));gap:10px;justify-content:start}
@media (max-width: 620px){
  .row-4{grid-template-columns:repeat(2,minmax(0,1fr));justify-content:stretch}
}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;color:var(--ink-3);font-weight:500}
/* Hard-coded white/black regardless of theme, same call as #loginCard's
   inputs — var(--ground)/var(--ink) paired correctly on paper, but a
   phone's native date/time picker digits follow the OS's own light/dark
   setting, not this CSS, so a dark-mode phone rendered pale text over
   the widget's own white chrome no matter what these variables said.
   color-scheme:light pins that native chrome to light too. */
.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;color:#111;color-scheme:light;
                                            border-radius:var(--radius);padding:6px 8px;font-size:13px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:58px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.hint{font-size:11.5px;color:var(--ink-3)}

.tierrow,.stafrow{display:grid;grid-template-columns:1fr 120px 32px;gap:8px;margin-bottom:6px;align-items:center}
.stafrow{grid-template-columns:140px 1fr 32px}
.stafrow-edit{grid-template-columns:110px 1fr 110px auto 32px}
@media (max-width: 620px){
  .stafrow-edit{display:flex;flex-wrap:wrap;gap:6px}
  .stafrow-edit select{flex:1 1 120px}
  .stafrow-edit input[type=time]{flex:0 0 100px}
}
.clockrow{display:grid;grid-template-columns:1fr auto 110px;gap:10px;align-items:center;margin-bottom:8px}
@media (max-width: 480px){
  .clockrow{grid-template-columns:1fr;justify-items:start}
}
.rowdel{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);width:32px;height:32px;
        color:var(--ink-3);display:grid;place-items:center;padding:0}
.rowdel:hover{color:var(--dead);border-color:var(--dead)}
.memberlist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.memberrow{display:grid;grid-template-columns:1fr 140px 1fr 32px;gap:8px;align-items:center}
@media (max-width:600px){.memberrow{grid-template-columns:1fr 32px;grid-template-areas:"name x" "phone phone" "email email"}
  .memberrow input:nth-child(1){grid-area:name} .memberrow input:nth-child(2){grid-area:phone}
  .memberrow input:nth-child(3){grid-area:email} .memberrow .rowdel{grid-area:x}}
.checkfield{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.checkfield input{width:auto}

.openslots{background:var(--openslot-bg);border:1px solid var(--openslot);border-radius:var(--radius);
           padding:10px 12px;margin-top:16px}
.openslots summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--openslot);list-style:revert}
.openslots-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.openslots-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;text-align:left;
               background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;
               font-size:12.5px;color:var(--ink)}
.openslots-showlink{border:none;background:none;color:var(--accent);font-size:12.5px;padding:0;
                     text-decoration:underline;cursor:pointer;flex:1 1 220px;text-align:left}
.openslots-row select{width:auto;flex:1 1 140px;font-size:12px;padding:4px 6px}
.openslots-row input[type=time]{flex:0 0 100px;font-size:12px;padding:4px 6px}
.holddaterow{display:grid;grid-template-columns:1fr 130px 32px;gap:8px;align-items:center;margin-bottom:6px}
.holddaterow>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}

.msgthread{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;margin-bottom:10px}
.msgrow{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.msgrow-reply{margin-left:24px;border-left:2px solid var(--accent-soft)}
.msghead{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3);margin-bottom:4px}
.msgauthor{font-weight:600;color:var(--ink-2)}
.msghead .x{margin-left:auto;border:none;background:none;color:var(--ink-3);width:20px;height:20px;border-radius:50%;
            display:grid;place-items:center;padding:0}
.msghead .x:hover{color:var(--dead);background:var(--surface)}
.msgbody{margin:0;font-size:13.5px;white-space:pre-wrap;line-height:1.4}
.msgactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.msgcompose{display:flex;flex-direction:column;gap:6px}
.replybanner{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);
             border-radius:var(--radius);padding:5px 10px;font-size:12px}
.replybanner .x{margin-left:auto;border:none;background:none;color:inherit;width:20px;height:20px;border-radius:50%;
                display:grid;place-items:center;padding:0}
.msgcomposerow{display:flex;gap:8px;align-items:flex-end}
.msgcomposerow textarea{flex:1;resize:vertical;min-height:44px}
.msgcomposerow .expandwrap{flex:1}
.mentionsuggest{position:absolute;left:0;bottom:100%;margin-bottom:4px;width:220px;max-height:180px;overflow-y:auto;
                 background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);z-index:5}
.mentionsuggest-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
                      padding:7px 10px;font-size:13px;color:var(--ink)}
.mentionsuggest-item:last-child{border-bottom:none}
.mentionsuggest-item:hover{background:var(--surface-2)}
.mention{font-weight:700;color:var(--accent)}

.mentionswrap{position:relative;display:inline-flex}
#mentionsBtn.has-mentions{border-color:var(--accent);color:var(--accent);font-weight:600}
.mentionspop{position:absolute;top:calc(100% + 6px);right:0;width:280px;max-height:340px;overflow-y:auto;
             background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
             box-shadow:var(--shadow);z-index:20;padding:6px}
.mentionitem{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);
             padding:8px 6px;cursor:pointer}
.mentionitem:last-child{border-bottom:none}
.mentionitem:hover{background:var(--surface-2)}
.mentionitem-head{font-size:11px;color:var(--ink-3);margin-bottom:2px}
.mentionitem-body{margin:0;font-size:13px;color:var(--ink);white-space:pre-wrap;
                   overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.expandwrap textarea{width:100%;resize:vertical}
.expandbtn{margin-top:6px}

/* A show's bill: each act starts lowercase/normal weight as a tentative
   hold; double-clicking one marks it confirmed (bold caps) — see
   event_artists.confirmed. Applied everywhere a bill is shown, calendar
   through the editor, off the exact same two classes. */
.act-pending{font-weight:400;text-transform:lowercase}
.act-confirmed{font-weight:700;text-transform:uppercase}
.actlist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.actlistrow{border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;background:var(--surface-2)}
.actlistrow-top{display:flex;align-items:center;gap:6px}
.actname{flex:1;cursor:pointer;user-select:none;font-size:13.5px}
.rowbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);width:28px;height:28px;
        color:var(--ink-2);display:grid;place-items:center;padding:0;font-size:11px;line-height:1}
.rowbtn:disabled{opacity:.35;cursor:default}
.rowbtn:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
.actlistrow .x{border:none;background:none;color:var(--ink-3);width:24px;height:24px;border-radius:50%;
               display:grid;place-items:center;padding:0}
.actlistrow .x:hover{color:var(--dead);background:var(--surface)}
.actrow{display:flex;gap:8px;align-items:flex-start}
.actrow input{flex:1}

/* A band that can't do the show: struck through and pushed to the end of
   the bill (both in storage order and here) so a booker scanning the list
   sees who's out at a glance. */
.act-declined-row{opacity:.6}
.act-declined-row .actname{text-decoration:line-through}

/* Press-and-drag reorder (10-12 band bills change order right up to the
   show) — a dedicated grip rather than the whole row, so a tap on the
   name/role/notes never gets mistaken for the start of a drag. */
.actgrip{cursor:grab;touch-action:none;color:var(--ink-3);font-size:15px;line-height:1;padding:0 2px;user-select:none}
.act-dragging{position:relative;z-index:5;opacity:.85;box-shadow:var(--shadow);cursor:grabbing}

/* Role, contact log, and notes all share one compact line; wraps only if
   the viewport genuinely can't fit them (narrow phone), never by default. */
.actmidrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.actmidrow select{width:auto;flex:none;font-size:11.5px;padding:3px 5px}
.actmidrow-fig{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
.actmidrow-fig input{width:56px;font-size:11.5px;padding:3px 5px}
.actcontact-note-input{flex:1 1 110px;min-width:90px;font-size:11.5px;padding:3px 6px;
                        border:1px solid var(--line);border-radius:var(--radius)}
.actmidrow textarea{flex:1 1 120px;min-width:80px;resize:vertical;min-height:24px;border:1px solid var(--line);
                     border-radius:var(--radius);padding:3px 6px;font-size:11.5px;font-family:inherit}
.actmidrow .expandbtn{flex:none;margin-top:0}
.btn-sm{padding:3px 8px;font-size:11px;border-radius:var(--radius)}
.actcontact{margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.actcontact-entry{margin:0;font-size:11px;color:var(--ink-3)}
.link-btn{border:none;background:none;color:var(--accent);font-size:11px;padding:0;text-decoration:underline;cursor:pointer}

.tasklist{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.taskitem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius);background:var(--ground);border:1px solid transparent}
.taskitem:hover{border-color:var(--line)}
.taskitem input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none;cursor:pointer}
.taskitem .tlabel{flex:1;font-size:13.5px;min-width:0}
.taskitem.done .tlabel{color:var(--ink-3);text-decoration:line-through}
.taskitem input[type=text]{border:1px solid transparent;background:transparent;color:var(--ink-3);font-size:12px;
                            width:120px;padding:2px 6px;border-radius:4px;text-align:right}
.taskitem input[type=text]:focus{border-color:var(--line);background:var(--surface);outline:none}

.person{border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-bottom:8px;background:var(--ground)}
.person-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.person-top input{flex:1;min-width:0}
.person-top .btn{flex:none;white-space:nowrap}
.rolepick{display:flex;flex-wrap:wrap;gap:5px}
.rolepick .chip{background:var(--surface)}
.rolepick .chip[aria-pressed="true"]{background:var(--accent-soft)}

.statusgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.statusopt{border:1px solid var(--line);border-radius:var(--radius);padding:8px 6px;text-align:center;
           font-size:12.5px;font-weight:600;background:var(--surface);color:var(--ink-3)}
.statusopt[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.statusopt-sm{padding:5px 2px;font-size:10.5px}
.statusgrid-6{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
@media (max-width: 620px){
  .statusopt-sm{font-size:8.5px;padding:5px 1px;letter-spacing:-.01em}
}

.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);
        color:var(--accent);border-radius:var(--radius);padding:8px 12px;margin-bottom:14px;font-size:12.5px}
.banner strong{font-weight:600}
.banner .btn{margin-left:auto;background:transparent;border-color:currentColor;color:inherit}
.banner.warn{background:var(--hold-3-bg);border-color:var(--hold-1-bg);color:var(--hold-1)}
tbody tr.unsettled-row td:first-child{box-shadow:inset 3px 0 0 var(--hold-1-bg)}
tbody tr.ma-due td:first-child{box-shadow:inset 3px 0 0 var(--dead)}
.notice{font-size:12px;color:var(--ink-3);margin-top:14px;text-align:center}

/* Vision board: quarters run left to right as columns, each one a stack of
   sticky notes. Colors just rotate for visual variety, no meaning attached. */
.visionboard{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.visioncol{flex:0 0 220px;min-width:220px}
.visioncol-head{font-family:var(--display);text-transform:uppercase;font-size:13px;letter-spacing:.03em;
                 color:var(--ink-2);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.visioncol-notes{display:flex;flex-direction:column;gap:12px}
.stickynote{border-radius:2px;padding:14px;cursor:pointer;box-shadow:var(--shadow);
            transform:rotate(-1deg);transition:transform .1s}
.stickynote:nth-child(even){transform:rotate(1deg)}
.stickynote:hover{transform:rotate(0deg) scale(1.02)}
.stickynote-text{margin:0;font-size:13.5px;line-height:1.4;white-space:pre-wrap;color:#1a1a1a}
.note-yellow{background:#f6e58d}
.note-pink{background:#f7c6d9}
.note-green{background:#c8e6c9}
.note-blue{background:#bbdefb}
.note-orange{background:#ffd8a8}
@media (max-width:660px){
  .visionboard{flex-direction:column}
  .visioncol{flex:none;min-width:0}
}

@media (max-width:860px){.legend{margin-left:0;width:100%}.monthnav h2{min-width:140px;font-size:17px}}
@media (max-width:660px){
  .dow div{font-size:9px;letter-spacing:.05em}
  .grid{gap:3px}
  .row,.row-3,.statusgrid{grid-template-columns:1fr}
  .statusgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .statusgrid-6{grid-template-columns:repeat(6,minmax(0,1fr))}
  .brand{font-size:19px}
  .sheet-body{padding:14px}
}
</style>
</head>
<body>

<div id="loginCard">
  <h1 class="brand">Concert<span>Pro</span></h1>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div id="loginError"></div>
  </form>
</div>

<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">Concert<span>Pro</span></h1>
      <div class="views" role="tablist" aria-label="View" id="navTabs" style="display:none">
        <button role="tab" data-view="calendar" aria-selected="true">Calendar</button>
        <button role="tab" data-view="list" aria-selected="false">List</button>
        <button role="tab" data-view="artists" aria-selected="false">Artists</button>
        <button role="tab" data-view="staff" aria-selected="false">Staff</button>
        <button role="tab" data-view="vision" aria-selected="false">Vision Board</button>
        <button role="tab" data-view="ma" aria-selected="false">M/A Offers</button>
        <button role="tab" data-view="settings" aria-selected="false">Settings</button>
      </div>
      <div class="monthnav" id="monthnav">
        <button class="icon-btn" id="prevMonth" aria-label="Previous month">&#8249;</button>
        <h2 id="monthLabel">&nbsp;</h2>
        <button class="icon-btn" id="nextMonth" aria-label="Next month">&#8250;</button>
        <button class="btn" id="todayBtn">Today</button>
      </div>
      <div class="spacer"></div>
      <div class="mentionswrap" id="mentionsWrap" style="display:none">
        <button class="btn" id="mentionsBtn">🔔 <span id="mentionsCount"></span></button>
        <div class="mentionspop" id="mentionsPop" hidden></div>
      </div>
      <span class="who" id="whoami"></span>
      <button class="btn btn-primary" id="bookBtn" style="display:none">+ Book a show</button>
      <button class="btn" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="filterbar" id="filterbar" style="display:none">
    <div class="filterbar-inner">
      <span class="eyebrow">Venue</span>
      <div class="chips" id="venueChips"></div>
      <span class="eyebrow" id="countLabel"></span>
      <div class="legend" id="legend"></div>
      <label class="showdead-toggle">
        <input type="checkbox" id="showDeadToggle">
        Show didn't work out
      </label>
    </div>
  </div>

  <main>
    <div id="bannerSlot"></div>
    <section id="view-calendar">
      <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
      <div class="grid" id="grid"></div>
    </section>
    <section id="view-list" hidden></section>
    <section id="view-artists" hidden></section>
    <section id="view-staff" hidden></section>
    <section id="view-people" hidden>
      <button type="button" class="btn btn-primary" id="addPersonBtn" style="margin-bottom:12px">+ Add a person</button>
      <div id="peopleHost"></div>
    </section>
    <section id="view-vision" hidden></section>
    <section id="view-ma" hidden></section>
    <section id="view-settings" hidden></section>
    <p class="notice" id="storeNotice"></p>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Show</h2>
      <div class="spacer"></div>
      <button class="icon-btn" id="sheetClose" aria-label="Close">&#10005;</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================== API ================================ */
async function api(path, opts) {
  const res = await fetch(path, Object.assign(
    {credentials: "same-origin", headers: {"Content-Type": "application/json"}}, opts));
  const body = await res.json().catch(() => ({}));
  return {ok: res.ok, status: res.status, body};
}

/* ============================== domain ============================= */
var STATUS = {
  hold1:    {label:"1st hold",        cls:"s-hold1",     swatch:"var(--hold-1-bg)"},
  hold2:    {label:"2nd hold",        cls:"s-hold2",     swatch:"var(--hold-1-bg)"},
  hold3:    {label:"3rd hold",        cls:"s-hold3",     swatch:"var(--hold-1-bg)"},
  confirmed:{label:"Confirmed",       cls:"s-confirmed", swatch:"var(--confirm-bg)"},
  complete: {label:"Complete",        cls:"s-complete",  swatch:"var(--done-bg)"},
  dead:     {label:"Didn't work out", cls:"s-dead",      swatch:"var(--dead-bg)"},
  unsettled:{label:"Needs settling",  cls:"s-unsettled", swatch:"var(--done-bg)"}
};
var STATUS_ORDER = ["hold1","hold2","hold3","confirmed","complete","dead"];
var HOLD_NUMBER = {hold1:1, hold2:2, hold3:3};
var BILL_ROLES = ["Touring","Direct Support","Support","Local"];
var NO_DEAL = "Not recorded";
var DEAL_TYPES = [NO_DEAL,"Guarantee","Guarantee vs %","Door split","Flat rental","Free / promo"];

function pad(n){ return n < 10 ? "0" + n : "" + n; }
function iso(y,m,d){ return y + "-" + pad(m+1) + "-" + pad(d); }
function todayISO(){ var t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); }
function parts(s){ var a = (s||"").split("-"); return {y:+a[0], m:+a[1]-1, d:+a[2]}; }
function dow(s){ var p = parts(s); return new Date(p.y, p.m, p.d).getDay(); }
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function shortDate(s){
  if(!s) return "";
  var p = parts(s);
  return DOW_SHORT[new Date(p.y,p.m,p.d).getDay()] + " " + MONTHS[p.m].slice(0,3) + " " + p.d;
}
function money(n){
  if(n === "" || n === null || n === undefined || isNaN(+n)) return "";
  return "$" + (+n).toLocaleString("en-US", {maximumFractionDigits:2});
}
function time12(t){
  if(!t) return "";
  var a = t.split(":"), h = +a[0], m = a[1] || "00";
  var ap = h >= 12 ? "pm" : "am"; h = h % 12; if(h === 0) h = 12;
  return h + (m === "00" ? "" : ":" + m) + ap;
}
function messageTime(iso){
  var d = new Date(iso);
  return d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}
/* Highlights @Name the same way the server matches them for the
   notification (longest name first) — display only; the server's own
   match when the message was posted is what actually decides who got
   notified, this just needs to look right. */
function messageBodyNodes(text){
  var frag = document.createDocumentFragment();
  var names = store.people.filter(function(p){ return p.access_level !== "crew"; })
    .map(function(p){ return p.name; }).sort(function(a,b){ return b.length - a.length; });
  var i = 0;
  while(i < text.length){
    var matchedName = null;
    if(text[i] === "@"){
      for(var n=0;n<names.length;n++){
        if(text.substr(i+1, names[n].length).toLowerCase() === names[n].toLowerCase()){ matchedName = names[n]; break; }
      }
    }
    if(matchedName){
      frag.appendChild(el("span","mention","@"+matchedName));
      i += 1 + matchedName.length;
    } else {
      var start = i;
      i++;
      while(i < text.length && text[i] !== "@") i++;
      frag.appendChild(document.createTextNode(text.slice(start, i)));
    }
  }
  return frag;
}
function isUnsettled(ev){ return !!ev && ev.status === "confirmed" && ev.show_date < todayISO(); }
function st(ev){ if(isUnsettled(ev)) return STATUS.unsettled; return (ev && STATUS[ev.status]) || STATUS.hold1; }
function actLabel(a){ return a.confirmed ? a.name.toUpperCase() : a.name.toLowerCase(); }
/* Everywhere EXCEPT the show editor itself only shows the top-slot act
   plus whichever other acts have been individually confirmed — an
   unconfirmed support act stays off the calendar/list entirely until
   someone double-clicks it, per Broc's rule. The editor always shows the
   full bill (fullBillName/the acts editor), since you're editing everything. */
function visibleActs(ev){
  var acts = ev.artists || [];
  return acts.filter(function(a, i){ return i === 0 || a.confirmed; });
}
function showName(ev){
  var acts = visibleActs(ev);
  return acts.length ? acts.map(actLabel).join(", ") : "Untitled hold";
}
function fullBillName(ev){
  var acts = ev.artists || [];
  return acts.length ? acts.map(actLabel).join(", ") : "Untitled hold";
}
/* Same bill, styled: each act gets its own confirmed/pending class instead
   of one plain string, so a headliner already confirmed can render bold
   caps while a support act still on hold stays lowercase next to it. */
function actsNodes(ev){
  var frag = document.createDocumentFragment();
  var acts = visibleActs(ev);
  if(!acts.length){ frag.appendChild(document.createTextNode("Untitled hold")); return frag; }
  acts.forEach(function(a, i){
    if(i > 0) frag.appendChild(document.createTextNode(", "));
    frag.appendChild(el("span", a.confirmed ? "act-confirmed" : "act-pending", a.name));
  });
  return frag;
}
function dealSummary(ev){
  var bits = [];
  if(ev.guarantee !== "" && ev.guarantee != null) bits.push(money(ev.guarantee));
  if(ev.backend_pct !== "" && ev.backend_pct != null) bits.push(ev.backend_pct + "%");
  var s = bits.join(" vs ");
  var type = (ev.deal_type && ev.deal_type !== NO_DEAL) ? ev.deal_type : "";
  if(!s) return type;
  return type && type !== "Guarantee" ? type + " · " + s : s;
}
function taskProgress(ev){
  var t = ev.tasks || [];
  return {done: t.filter(function(x){ return x.done; }).length, total: t.length};
}
function staffLabel(s){ return s.person_name || (s.person_id ? "(removed person)" : "TBA"); }
function normName(s){ return (s||"").toLowerCase().replace(/^the\s+/,"").replace(/[^a-z0-9]/g,""); }

/* ============================== state =============================== */
var store = {events:[], venues:[], roles:[], people:[], artists:[], visionNotes:[], maOffers:[]};
var phoneMQ = window.matchMedia ? window.matchMedia("(max-width: 660px)") : null;
function isPhone(){ return !!(phoneMQ && phoneMQ.matches); }
var ui = {view:"calendar", cursor:(function(){ var t=new Date(); return {y:t.getFullYear(), m:t.getMonth()}; })(), venue:"__all__", showDead:false, staffOnlyMine:false, listSearch:""};
var me = {access_level:"crew"};
function canBook(){ return me.access_level === "booker" || me.access_level === "owner"; }

function eventById(id){ return store.events.find(function(e){ return e.id === id; }); }
function visibleEvents(){
  return store.events.filter(function(ev){
    if(ev.venue !== ui.venue && ui.venue !== "__all__") return false;
    if(ev.status === "dead" && !ui.showDead) return false;
    return true;
  }).slice().sort(function(a,b){ return a.show_date < b.show_date ? -1 : a.show_date > b.show_date ? 1 : 0; });
}
function artistTotals(name){
  var n = normName(name), paid = 0, played = 0, count = 0, last = "";
  store.events.forEach(function(ev){
    var acts = ev.artists || [];
    if(!acts.some(function(a){ return normName(a.name) === n; })) return;
    count++;
    var p = ev.settlement && ev.settlement.artist_payout;
    if(p !== "" && p != null && !isNaN(+p)) paid += +p;
    if(ev.status === "complete"){ played++; if(ev.show_date > last) last = ev.show_date; }
  });
  return {count:count, played:played, paid:paid, last:last};
}

/* ============================== loading ============================= */
function setNotice(text){
  var el = document.getElementById("storeNotice");
  el.textContent = text || ""; el.hidden = !text;
}

async function loadEvents(){
  var r = await api("/api/events");
  if(r.ok) store.events = r.body.events;
  else setNotice("Could not load the calendar (" + r.status + ").");
  renderAll();
}
async function loadBookerLookups(){
  if(!canBook()) return;
  var [v, ro, pe, ar, vn, ma] = await Promise.all([api("/api/venues"), api("/api/roles"), api("/api/people"),
    api("/api/artists"), api("/api/vision_notes"), api("/api/ma_offers")]);
  if(v.ok) store.venues = v.body.venues;
  if(ro.ok) store.roles = ro.body.roles;
  if(pe.ok) store.people = pe.body.people;
  if(ar.ok) store.artists = ar.body.artists;
  if(vn.ok) store.visionNotes = vn.body.notes;
  if(ma.ok) store.maOffers = ma.body.offers;
}

/* ============================== dom helpers ========================== */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}

/* ============================== top-level render ===================== */
function renderAll(){
  renderVenueChips();
  renderLegend();
  renderBanner();
  document.getElementById("monthLabel").textContent = MONTHS[ui.cursor.m] + " " + ui.cursor.y;
  document.getElementById("monthnav").style.display = (ui.view === "calendar") ? "flex" : "none";

  var all = visibleEvents();
  var thisMonth = all.filter(function(ev){
    var p = parts(ev.show_date); return p.y === ui.cursor.y && p.m === ui.cursor.m;
  }).length;
  document.getElementById("countLabel").textContent = thisMonth + " in " + MONTHS[ui.cursor.m].slice(0,3) + " · " + all.length + " total";

  ["calendar","list","artists","staff","people","vision","ma","settings"].forEach(function(v){
    document.getElementById("view-" + v).hidden = (v !== ui.view);
  });
  if(ui.view === "calendar") renderCalendar();
  if(ui.view === "list") renderListView();
  if(ui.view === "artists") renderArtistsView();
  if(ui.view === "staff") renderStaffView();
  if(ui.view === "people") renderPeopleTable();
  if(ui.view === "vision") renderVisionBoard();
  if(ui.view === "ma") renderMAOffers();
  if(ui.view === "settings") renderSettingsView();
}

function renderVenueChips(){
  var box = document.getElementById("venueChips");
  box.innerHTML = "";
  var opts = [{v:"__all__", label:"All venues"}].concat(store.venues.map(function(v){ return {v:v.name, label:v.name}; }));
  opts.forEach(function(o){
    var b = el("button","chip",o.label);
    b.setAttribute("aria-pressed", ui.venue === o.v ? "true" : "false");
    b.onclick = function(){ ui.venue = o.v; renderAll(); };
    box.appendChild(b);
  });
}
function renderLegend(){
  var box = document.getElementById("legend");

/* ============================== calendar ============================= */
function showChip(ev){
  var b = el("button","show " + st(ev).cls);
  var holdNum = HOLD_NUMBER[ev.status];
  if(holdNum) b.appendChild(el("span","holdnum", String(holdNum)));
  var name = el("span","name"); name.appendChild(actsNodes(ev));
  b.appendChild(name);
  var bits = [];
  if(ev.doors) bits.push(time12(ev.doors));
  if(ui.venue === "__all__") bits.push(ev.venue);
  b.appendChild(el("span","meta", bits.join(" · ")));
  b.title = showName(ev) + " — " + st(ev).label + " — " + ev.venue;
  b.onclick = function(){ openEvent(ev.id); };
  return b;
}

function renderCalendar(){
  var byDate = {};
  visibleEvents().forEach(function(ev){ (byDate[ev.show_date] = byDate[ev.show_date] || []).push(ev); });

  var y = ui.cursor.y, m = ui.cursor.m;
  var first = new Date(y, m, 1);
  var lead = first.getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var prevDays = new Date(y, m, 0).getDate();
  var today = todayISO();
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  var totalCells = Math.ceil((lead + daysInMonth) / 7) * 7;
  var phone = isPhone();

  for(var i = 0; i < totalCells; i++){
    var dayNum, cy = y, cm = m, out = false;
    if(i < lead){ dayNum = prevDays - lead + 1 + i; cm = m - 1; out = true; }
    else if(i >= lead + daysInMonth){ dayNum = i - lead - daysInMonth + 1; cm = m + 1; out = true; }
    else dayNum = i - lead + 1;
    if(cm < 0){ cm = 11; cy = y - 1; }
    if(cm > 11){ cm = 0; cy = y + 1; }
    var ds = iso(cy, cm, dayNum);
    var list = byDate[ds] || [];
    grid.appendChild(phone ? phoneCell(ds, dayNum, list, out, ds === today) : deskCell(ds, dayNum, list, out, ds === today));
  }
}
function deskCell(ds, dayNum, list, out, isToday){
  var cell = el("div","cell" + (out ? " out" : "") + (isToday ? " today" : ""));
  var head = el("div","cell-head");
  head.appendChild(el("span","daynum", String(dayNum)));
  if(canBook()){
    var add = el("button","addday","+");
    add.setAttribute("aria-label","Book a show on " + shortDate(ds));
    add.onclick = function(e){ e.stopPropagation(); openEvent(null, ds); };
    head.appendChild(add);
  }
  cell.appendChild(head);
  list.forEach(function(ev){ cell.appendChild(showChip(ev)); });
  return cell;
}
function phoneCell(ds, dayNum, list, out, isToday){
  var b = el("button","cell-btn" + (out ? " out" : "") + (isToday ? " today" : "") + (list.length ? "" : " free"));
  b.appendChild(el("span","daynum", String(dayNum)));
  var dots = el("div","dots");
  list.slice(0,4).forEach(function(ev){
    var d = el("span","dot"); var s = st(ev);
    d.style.background = s.swatch;
    if(isUnsettled(ev)) d.style.border = "1px solid var(--hold-1-bg)";
    dots.appendChild(d);
  });
  if(list.length > 4) dots.appendChild(el("span","dot-more","+" + (list.length - 4)));
  b.appendChild(dots);
  b.setAttribute("aria-label", shortDate(ds) + " — " + (list.length ? list.length + " booked" : "open"));
  b.onclick = function(){ openDay(ds, list); };
  return b;
}
function openDay(ds, list){
  var body = document.getElementById("sheetBody"), foot = document.getElementById("sheetFoot");
  document.getElementById("sheetTitle").textContent = shortDate(ds);
  body.innerHTML = ""; foot.innerHTML = "";
  if(!list.length){
    var e = el("div","empty");
    e.appendChild(el("h3",null,"Open"));
    e.appendChild(el("p",null,"Nothing on this date" + (ui.venue === "__all__" ? " at any venue." : " at " + ui.venue + ".")));
    body.appendChild(e);
  } else {
    var wrap = el("div","daylist");
    list.forEach(function(ev){
      var card = el("button","show " + st(ev).cls);
      card.style.padding = "9px 10px";
      var name = el("span","name"); name.appendChild(actsNodes(ev));
      card.appendChild(name);
      var bits = [ev.venue, st(ev).label];
      if(ev.doors) bits.push("doors " + time12(ev.doors));
      card.appendChild(el("span","meta", bits.join(" · ")));
      card.onclick = function(){ openEvent(ev.id); };
      wrap.appendChild(card);
    });
    body.appendChild(wrap);
  }
  if(canBook()){
    var add = el("button","btn btn-primary", list.length ? "Add another show" : "Book this date");
    add.onclick = function(){ openEvent(null, ds); };
    foot.appendChild(add);
  }
  var close = el("button","btn","Close");
  close.onclick = closeSheet;
  foot.appendChild(close);
  openScrim();
}

/* ============================== list view ============================= */
function statusPill(ev){ return el("span","pill " + st(ev).cls, st(ev).label); }

function searchShows(query){
  // History search: every show ever, not just what venue/showDead filters
  // currently allow through — a dead show never happened (excluded
  // outright) and a band marked "can't do it" on a bill didn't actually
  // play that show (excluded per-show, even if the show itself is fine).
  var n = normName(query);
  if(!n) return [];
  return store.events.filter(function(ev){
    if(ev.status === "dead") return false;
    return (ev.artists||[]).some(function(a){ return !a.declined && normName(a.name).indexOf(n) >= 0; });
  }).slice().sort(function(a,b){ return a.show_date < b.show_date ? 1 : a.show_date > b.show_date ? -1 : 0; });
}

    tr.appendChild(el("td","date-col", shortDate(ev.show_date)));
    tr.appendChild(el("td",null, ev.venue));

    td.appendChild(actsNodes(ev));

    var stc = document.createElement("td"); stc.appendChild(statusPill(ev)); tr.appendChild(stc);
    tr.appendChild(el("td","date-col", time12(ev.doors)));

    if(canBook()){
      var tiers = (ev.ticket_tiers||[]).filter(function(x){ return x.price !== "" && x.price != null; });

      tr.appendChild(el("td","date-col", ev.onsale_date ? shortDate(ev.onsale_date) : "—"));

        hr2.appendChild(th);

        tr.appendChild(el("td","num", money(s.gross) || "—"));
        tr.appendChild(el("td","num", money(s.expenses) || "—"));
        tr.appendChild(el("td","num", money(s.artist_payout) || "—"));
        tr.appendChild(el("td","num", (s.gross===""||s.gross==null) ? "—" : money(net)));
        var stc2 = document.createElement("td");
        stc2.appendChild(el("span","pill " + (s.settled ? "s-confirmed" : "s-hold2"), s.settled ? "Settled" : "Open"));
        tr.appendChild(stc2);
        tb2.appendChild(tr);
      });
      t2.appendChild(tb2); w2.appendChild(t2); host.appendChild(w2);
    }
  }

var artistFilter = {tier:"", genre:"", tag:""};
function filteredArtists(){
  var tier = artistFilter.tier, genre = artistFilter.genre.trim().toLowerCase(), tag = artistFilter.tag.trim().toLowerCase();
  return store.artists.filter(function(a){
    if(tier && a.tier !== tier) return false;
    if(genre && (a.genre||"").toLowerCase().indexOf(genre) < 0) return false;
    if(tag && !(a.tags||[]).some(function(t){ return t.toLowerCase().indexOf(tag) >= 0; })) return false;
    return true;
  });
}

function artistShowHistory(artistId){
  var rows = [];
  store.events.forEach(function(ev){
    (ev.artists||[]).forEach(function(a){
      if(a.artist_id === artistId) rows.push({
        show_date: ev.show_date, venue: ev.venue, status: ev.status,
        confirmed: a.confirmed, guarantee: a.guarantee, paid: a.paid, walkups: a.walkups,
      });
    });
  });
  return rows.sort(function(a,b){ return a.show_date < b.show_date ? 1 : a.show_date > b.show_date ? -1 : 0; });
}

          tr.appendChild(el("td","num", h.guarantee != null ? money(h.guarantee) : "—"));
          tr.appendChild(el("td","num", h.paid != null ? money(h.paid) : "—"));
          tr.appendChild(el("td","num", h.walkups != null ? String(h.walkups) : "—"));
          tb.appendChild(tr);
        });
        t.appendChild(tb); wrap.appendChild(t); fsH.appendChild(wrap);
      }
      body.appendChild(fsH);
    }

    var errLine = el("span","hint"); errLine.style.color = "var(--dead)";
    var save = el("button","btn btn-primary","Save");
    save.onclick = async function(){
      errLine.textContent = "";
      var name = draftA.name.trim();
      if(!a && !name){ errLine.textContent = "Give the band a name."; return; }
      var members = draftA.members.filter(function(m){ return m.name.trim(); });

      var id = artistId;
      if(!id){
        var created = await api("/api/artists", {method:"POST", body: JSON.stringify({name: name})});
        if(!created.ok){ errLine.textContent = created.body.error || "Could not create."; return; }
        id = created.body.id;
      }
      var tags = draftA.tags.split(",").map(function(t){ return t.trim(); }).filter(function(t){ return t; });
      var r = await api("/api/artists/" + id, {method:"PATCH", body: JSON.stringify({
        tier: draftA.tier || null, genre: draftA.genre, location: draftA.location, tags: tags,
        instagram: draftA.instagram, facebook: draftA.facebook, website: draftA.website, spotify: draftA.spotify,
        notes: draftA.notes,
      })});
      if(!r.ok){ errLine.textContent = r.body.error || "Could not save."; return; }
      await api("/api/artists/" + id + "/members", {method:"PUT", body: JSON.stringify({members: members})});
      await loadBookerLookups();
      closeSheet();
      renderAll();
    };
    foot.appendChild(save);
    var cancel = el("button","btn","Cancel");
    cancel.onclick = closeSheet;
    foot.appendChild(cancel);
    foot.appendChild(errLine);
  }

  renderForm();
  openScrim();
}

  var td = document.createElement("td");
  if(!value){ td.className = "sub"; td.textContent = "—"; return td; }

  var a = document.createElement("a");
  a.href = scheme + value; a.textContent = value; a.style.color = "var(--accent)";
  a.onclick = function(e){ e.stopPropagation(); };
  td.appendChild(a);
  return td;
}

var draft = null, draftIsNew = false;

function field(label, node){
  var f = el("div","field");
  var l = el("label", null, label);
  node.id = node.id || "f_" + label.toLowerCase().replace(/[^a-z0-9]+/g,"_") + "_" + Math.random().toString(36).slice(2,6);
  l.setAttribute("for", node.id);
  f.appendChild(l); f.appendChild(node);
  return f;
}
function input(type, value, onInput){
  var i = document.createElement("input");
  i.type = type; i.value = (value == null ? "" : value);
  i.oninput = function(){ onInput(i.value); scheduleAutosave(); };
  return i;
}
/* A textarea with an Expand toggle for growing it into a much bigger box
   when there's a lot to read/write — used for notes fields that can get
   long (show notes, a band's notes). */
function expandableTextarea(value, onInput, rows){
  var wrap = el("div","expandwrap");
  var ta = document.createElement("textarea");
  ta.value = value || "";
  ta.rows = rows || 4;
  ta.oninput = function(){ onInput(ta.value); scheduleAutosave(); };
  wrap.appendChild(ta);
  var expandBtn = el("button","btn expandbtn","Expand");
  expandBtn.type = "button";
  var expanded = false;
  expandBtn.onclick = function(){
    expanded = !expanded;
    ta.rows = expanded ? 18 : (rows || 4);
    expandBtn.textContent = expanded ? "Collapse" : "Expand";
  };
  wrap.appendChild(expandBtn);
  return wrap;
}
function selectKV(options, value, onChange){
  var s = document.createElement("select");
  options.forEach(function(o){
    var op = document.createElement("option");
    op.value = o.value; op.textContent = o.label;
    if(String(o.value) === String(value)) op.selected = true;
    s.appendChild(op);
  });
  s.onchange = function(){ onChange(s.value); scheduleAutosave(); };
  return s;
}
function select(options, value, onChange){ return selectKV(options.map(function(o){ return {value:o,label:o}; }), value, onChange); }

async function openEvent(id, dateHint){
  if(!canBook()){
    // Crew never gets the booker sheet — it's built around fields
    // (status, deal, settlement) their own /api/events response never
    // even includes. Route to the read-only card instead, which only
    // ever touches what _events_for_crew actually sent.
    if(id) renderCrewSheet(eventById(id));
    return;
  }
  if(id){
    var ev = eventById(id);
    draft = JSON.parse(JSON.stringify(ev));
    draft.messages = [];
    draftIsNew = false;
  } else {
    draft = {
      id:null, venue_id: store.venues[0] ? store.venues[0].id : null, venue: store.venues[0] ? store.venues[0].name : "",
      artists:[], status:"hold1", show_date: dateHint || todayISO(), doors:"19:00", show_time:"20:00",
      deal_type:NO_DEAL, guarantee:"", backend_pct:"", deal_notes:"",
      ticket_tiers:[{label:"Advance",price:""},{label:"Day of show",price:""}], ticket_link:"",
      announce_date:"", onsale_date:"", notes:"", messages:[], extraDates:[], group_members:[],
      tasks:[], staff:[], settlement:{tickets_sold:"",gross:"",expenses:"",artist_payout:"",settled:false,notes:""}
    };
    draftIsNew = true;
  }
  renderSheet();
  openScrim();
  if(id){
    var r = await api("/api/events/" + id + "/messages");
    if(r.ok && draft && draft.id === id){ draft.messages = r.body.messages; renderSheet(); }
    await refreshMentions(); // opening the thread just marked any of my mentions in it read
  }
}

/* The crew-safe show card: date/venue/lineup/doors plus their own
   assignment(s) and a Clock In/Out button. Never touches draft/renderSheet
   at all, so there is no field in the booker editor a crew viewer could
   ever be one bug away from seeing — the data was never fetched for them
   in the first place (see permissions.py _events_for_crew). */
function renderCrewSheet(ev){
  var body = document.getElementById("sheetBody"), foot = document.getElementById("sheetFoot");
  body.innerHTML = ""; foot.innerHTML = "";
  document.getElementById("sheetTitle").textContent = fullBillName(ev);

  var info = el("p","hint", shortDate(ev.show_date) + " · " + ev.venue +
    (ev.doors ? " · doors " + time12(ev.doors) : "") + (ev.show_time ? " · show " + time12(ev.show_time) : ""));
  body.appendChild(info);
  body.appendChild(el("p",null, (ev.artists||[]).map(function(a){ return a.name; }).join(", ") || "Lineup TBA"));

  var fs = document.createElement("fieldset");
  fs.appendChild(el("legend",null,"Your shift"));
  if(!(ev.my_assignments||[]).length){
    fs.appendChild(el("p","hint","You're not scheduled on this show."));
  } else {
    ev.my_assignments.forEach(function(a){
      var row = el("div","clockrow");
      var label = a.role + (a.scheduled_time ? " — " + time12(a.scheduled_time) : "");
      row.appendChild(el("span",null,label));
      var status = el("span","hint", a.clocked_out_at ? "Clocked out " + messageTime(a.clocked_out_at)
        : a.clocked_in_at ? "Clocked in " + messageTime(a.clocked_in_at) : "Not clocked in");
      row.appendChild(status);
      var btn = el("button","btn btn-primary", a.clocked_out_at ? "Done" : a.clocked_in_at ? "Clock out" : "Clock in");
      btn.type = "button";
      btn.disabled = !!a.clocked_out_at;
      btn.onclick = async function(){
        var action = a.clocked_in_at ? "out" : "in";
        var r = await api("/api/assignments/" + a.id + "/clock", {method:"POST", body: JSON.stringify({action:action})});
        if(r.ok){
          a.clocked_in_at = r.body.clocked_in_at; a.clocked_out_at = r.body.clocked_out_at;
          renderCrewSheet(ev);
        }
      };
      row.appendChild(btn);
      fs.appendChild(row);
    });
  }
  body.appendChild(fs);

  var close = el("button","btn","Close");
  close.onclick = closeSheet;
  foot.appendChild(close);
  openScrim();
}
async function refreshEventMessages(){
  var id = draft.id;
  var r = await api("/api/events/" + id + "/messages");
  if(r.ok && draft && draft.id === id){ draft.messages = r.body.messages; renderSheet(); }
  await refreshMentions();
}
// Remembers whichever tab was showing when a sheet opened, so closing it
// (Done/Close/✕/Esc/after Save or Delete) goes back to THAT tab — opening
// a show from Staff and landing back on Calendar was several unwanted
// extra clicks for something that started on Staff.
var sheetOpenedFromView = null;
function openScrim(){
  document.getElementById("scrim").hidden = false; document.body.style.overflow = "hidden";
  if(sheetOpenedFromView === null) sheetOpenedFromView = ui.view;
}
function closeSheet(){
  document.getElementById("scrim").hidden = true; document.body.style.overflow = ""; draft = null;
  if(sheetOpenedFromView && ui.view !== sheetOpenedFromView){ ui.view = sheetOpenedFromView; setActiveTab(); renderAll(); }
  sheetOpenedFromView = null;
}

/* Autosave for an existing show being edited: every keystroke/selection
   inside the sheet reschedules one debounced PATCH so a booker who
   forgets to hit Save never loses what they typed. A brand-new,
   not-yet-booked show is excluded — there's no id to PATCH yet, so it
   still needs its one explicit "Book it" click. Hooked centrally into
   the shared input()/expandableTextarea()/selectKV() helpers (rule: one
   function decides "something changed", not a callback wired at every
   field) plus a few direct call sites for act list actions that don't
   go through those helpers (add/remove/decline/reorder). */
var autosaveTimer = null;
function scheduleAutosave(){
  if(!draft || draftIsNew) return;
  clearTimeout(autosaveTimer);
  var errLine = document.getElementById("sheetError");
  if(errLine){ errLine.textContent = "Saving…"; errLine.style.color = "var(--ink-3)"; }
  autosaveTimer = setTimeout(doAutosave, 900);
}
async function doAutosave(){
  if(!draft || draftIsNew) return;
  var errLine = document.getElementById("sheetError");
  var acts = (draft.artists||[]).filter(function(a){ return (a.name||"").trim(); });
  if(!acts.length){
    if(errLine){ errLine.textContent = "Add at least one act to save."; errLine.style.color = "var(--dead)"; }
    return;
  }
  var eventId = draft.id;
  var payload = {
    venue_id: draft.venue_id, show_date: draft.show_date,
    status: draft.status, doors: draft.doors, show_time: draft.show_time,
    deal_type: draft.deal_type, guarantee: draft.guarantee, backend_pct: draft.backend_pct,
    deal_notes: draft.deal_notes, announce_date: draft.announce_date, onsale_date: draft.onsale_date,
    notes: draft.notes, ticket_link: draft.ticket_link, version: draft.version,
  };
  var r = await api("/api/events/" + eventId, {method:"PATCH", body: JSON.stringify(payload)});
  if(!draft || draft.id !== eventId) return; // sheet moved on while this was in flight
  if(!r.ok){
    if(errLine){
      errLine.style.color = "var(--dead)";
      errLine.textContent = r.body.error === "version_conflict"
        ? "Someone else changed this show while you had it open. Reload and try again."
        : (r.body.error || "Could not save.");
    }
    return;
  }
  draft.version = r.body.version;
  await api("/api/events/" + eventId + "/artists", {method:"PUT", body: JSON.stringify({artists: acts})});
  var tiersToSave = (draft.ticket_tiers||[]).filter(function(t){ return (t.label||"").trim(); });
  await api("/api/events/" + eventId + "/ticket_tiers", {method:"PUT", body: JSON.stringify({tiers: tiersToSave})});
  if(!draft || draft.id !== eventId) return;
  if(errLine) errLine.textContent = "Saved " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  await loadEvents();
  await loadBookerLookups();
}

function renderSheet(){
  var body = document.getElementById("sheetBody"), foot = document.getElementById("sheetFoot");
  body.innerHTML = ""; foot.innerHTML = "";
  document.getElementById("sheetTitle").textContent = draftIsNew ? "Book a show" : fullBillName(draft);

  fs1.appendChild(multiWrap);

  if(isMultiDay){
    var datesField = el("div","field"); datesField.style.marginTop = "10px";
    datesField.appendChild(el("label", null, "Held dates — each keeps its own status"));
    var members = (draft.group_members||[]).slice()
      .sort(function(a,b){ return a.show_date < b.show_date ? -1 : a.show_date > b.show_date ? 1 : 0; });

        del.type = "button";
        del.title = m.id === draft.id ? "Can't remove the date you're currently viewing" : "Remove this date from the hold";
        del.disabled = m.id === draft.id || members.length <= 1;
        del.onclick = async function(){
          await api("/api/events/" + m.id + "/hold_date", {method:"DELETE"});
          await refreshDraft();
        };
        row.appendChild(del);
        datesList.appendChild(row);
      });
      datesField.appendChild(datesList);
    }
    if(draftIsNew){
      datesField.appendChild(el("p","hint",
        (draft.extraDates||[]).length
          ? "Also holding (same status as above until saved): " + draft.extraDates.slice().sort().join(", ")
          : "Add the other candidate dates below — they'll start at the same status as this one; adjust each after saving."));
    }

    var addOneRow = el("div","actrow");
    var newDateInput = input("date", "", function(){});
    addOneRow.appendChild(newDateInput);
    var newVenueSel = selectKV(store.venues.map(function(v){ return {value:v.id, label:v.name}; }),
      draft.venue_id, function(){});
    addOneRow.appendChild(newVenueSel);
    var addOneBtn = el("button","btn","+ Add date");
    addOneBtn.type = "button";
    addOneBtn.onclick = async function(){
      // Venue is per-date, not shared — "1st hold at Frankies, 2nd hold
      // at Cla-Zel" is two members of the same group at two rooms.
      if(draftIsNew) await addHoldDates([newDateInput.value]);
      else await addHoldDates([{date: newDateInput.value, venue_id: Number(newVenueSel.value)}]);
    };
    addOneRow.appendChild(addOneBtn);

    var rangeRow = el("div","row"); rangeRow.style.marginTop = "8px";

    datesField.appendChild(addRangeBtn);

    fs1.appendChild(datesField);
  }
  body.appendChild(fs1);

  var fs2 = document.createElement("fieldset");
  fs2.appendChild(el("legend",null,"Status"));
  var sg = el("div","statusgrid statusgrid-6");
  STATUS_ORDER.forEach(function(k){
    var b = el("button","statusopt statusopt-sm " + STATUS[k].cls, STATUS[k].label);

/* after a task/staff/settlement action, reload real data and re-open the
   same show so the sheet reflects the server, not a locally-guessed state */
/* Fields the user edits in-place and that autosave may not have flushed
   yet (it's debounced ~900ms behind typing) — a task/staff/settlement
   action must not silently wipe these out from under them mid-edit. */
var UNSAVED_FIELDS = ["venue_id","artists","show_date","doors","show_time",
  "status","deal_type","guarantee","backend_pct","deal_notes","ticket_tiers",
  "announce_date","onsale_date","notes","ticket_link"];

async function refreshDraft(){
  var id = draft.id;
  var pending = {};
  UNSAVED_FIELDS.forEach(function(k){ pending[k] = draft[k]; });
  await loadEvents();
  await loadBookerLookups();
  var fresh = JSON.parse(JSON.stringify(eventById(id)));
  draft = Object.assign(fresh, pending);  // tasks/staff/settlement/version come from the server; everything still-unsaved survives
  renderSheet();
}

/* Every date from start to end inclusive — the "select multiple dates"
   shortcut for a multi-day hold, so a five-night run doesn't mean five
   individual add-a-date clicks. */
function datesInRange(start, end){
  if(!start || !end) return [];
  var out = [], p1 = parts(start), p2 = parts(end);
  var d = new Date(p1.y, p1.m, p1.d), last = new Date(p2.y, p2.m, p2.d);
  if(d > last) return [];
  while(d <= last){
    out.push(iso(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
async function addHoldDates(dates){
  dates = dates.filter(function(d){ return d; });
  if(!dates.length) return;
  if(draftIsNew){
    draft.extraDates = (draft.extraDates||[]).concat(dates);
    renderSheet();
  } else {
    await api("/api/events/" + draft.id + "/hold_dates", {method:"POST", body: JSON.stringify({dates:dates})});
    await refreshDraft();
  }
}
async function updateHoldDateStatus(eventId, newStatus, version){
  var r = await api("/api/events/" + eventId, {method:"PATCH", body: JSON.stringify({status:newStatus, version:version})});
  if(!r.ok){
    window.alert(r.body.error === "version_conflict" ? "Someone else changed that date. Reloading." : (r.body.error || "Could not save."));
    await refreshDraft();
    return;
  }
  if(newStatus === "confirmed"){
    // Confirming collapses the whole group — the id we just confirmed is
    // the only one guaranteed to still exist, so reopen fresh on it
    // rather than trying to guess whether draft.id survived.
    await loadEvents();
    await loadBookerLookups();
    await openEvent(eventId);
  } else {
    await refreshDraft();
  }
}

var NOTE_COLORS = ["note-yellow","note-pink","note-green","note-blue","note-orange"];
function quarterKey(n){ return (n.target_quarter && n.target_year) ? n.target_year + "-" + n.target_quarter : "someday"; }
function quarterLabel(key){
  if(key === "someday") return "Someday — no target yet";
  var parts = key.split("-");
  return "Q" + parts[1] + " " + parts[0];
}
function visionColumns(){
  var groups = {};
  (store.visionNotes||[]).forEach(function(n){
    var key = quarterKey(n);
    (groups[key] = groups[key] || []).push(n);
  });
  var dated = Object.keys(groups).filter(function(k){ return k !== "someday"; }).sort(function(a,b){
    var pa = a.split("-").map(Number), pb = b.split("-").map(Number);
    return pa[0] - pb[0] || pa[1] - pb[1];
  });
  var keys = dated.concat(groups["someday"] ? ["someday"] : []);
  return keys.map(function(k){ return {key:k, notes: groups[k]}; });
}

  fsRoles.appendChild(pick);
  body.appendChild(fsRoles);

  if(outranked) body.appendChild(el("p","hint","You don't have permission to edit this person."));

  var errLine = el("span","hint"); errLine.style.color = "var(--dead)";
  if(!outranked){
    var save = el("button","btn btn-primary","Save");
    save.onclick = async function(){
      errLine.textContent = "";
      if(!p){
        var r = await api("/api/people", {method:"POST", body: JSON.stringify({
          name: draftP.name, email: draftP.email, phone: draftP.phone, access_level: draftP.access_level})});
        if(!r.ok){ errLine.textContent = r.body.error || "Could not create."; return; }
        if(draftP.roles.length) await api("/api/people/" + r.body.id + "/roles", {method:"PUT", body: JSON.stringify({role_ids: draftP.roles})});
        await loadBookerLookups();
        window.alert("Temp password: " + r.body.temp_password + "\n\nGive this to them — they should change it after logging in.");
        closeSheet();
        renderAll();
      } else {
        var r2b = await api("/api/people/" + p.id, {method:"PATCH", body: JSON.stringify({
          name: draftP.name, phone: draftP.phone, active: draftP.active, access_level: draftP.access_level})});
        if(!r2b.ok){ errLine.textContent = r2b.body.error || "Could not save."; return; }
        await api("/api/people/" + p.id + "/roles", {method:"PUT", body: JSON.stringify({role_ids: draftP.roles})});
        await loadBookerLookups();
        closeSheet();
        renderAll();
      }
    };
    foot.appendChild(save);
  }
  var cancel = el("button","btn","Cancel");
  cancel.onclick = closeSheet;
  foot.appendChild(cancel);
  foot.appendChild(errLine);
  if(p && !outranked){
    foot.appendChild(el("div","spacer"));
    var resetBtn = el("button","btn","Reset password");
    resetBtn.onclick = async function(){
      var r = await api("/api/people/" + p.id + "/reset-password", {method:"POST"});
      if(r.ok) window.alert("New temp password: " + r.body.temp_password);
      else errLine.textContent = r.body.error || "Could not reset password.";
    };
    foot.appendChild(resetBtn);
  }
  openScrim();
}

/* ============================== settings ============================== */
function currentTheme(){
  try{
    var t = localStorage.getItem("cp_theme");
    return (t === "light" || t === "dark") ? t : "system";
  }catch(e){ return "system"; }
}
function setTheme(theme){
  if(theme === "light" || theme === "dark"){
    document.documentElement.setAttribute("data-theme", theme);
    try{ localStorage.setItem("cp_theme", theme); }catch(e){}
  } else {
    document.documentElement.removeAttribute("data-theme");
    try{ localStorage.removeItem("cp_theme"); }catch(e){}
  }
  renderSettingsView();
}
function renderSettingsView(){
  var host = document.getElementById("view-settings");
  host.innerHTML = "";
  var fs = document.createElement("fieldset");
  fs.appendChild(el("legend",null,"Appearance"));
  var grid = el("div","statusgrid");
  var active = currentTheme();
  [["system","Match device"],["light","Light"],["dark","Dark"]].forEach(function(opt){
    var b = el("button","statusopt", opt[1]);
    b.type = "button";
    b.setAttribute("aria-pressed", active === opt[0] ? "true" : "false");
    b.onclick = function(){ setTheme(opt[0]); };
    grid.appendChild(b);
  });
  fs.appendChild(grid);
  fs.appendChild(el("p","hint","Dark and Light stay picked on this device regardless of your system setting. Match device follows whatever your phone or computer is set to."));
  host.appendChild(fs);

  if(canBook()){
    var fsPeople = document.createElement("fieldset");
    fsPeople.appendChild(el("legend",null,"People"));
    fsPeople.appendChild(el("p","hint","Create accounts, set access level, and manage who covers which job role."));
    var goPeople = el("button","btn btn-primary","Manage people");
    goPeople.type = "button";
    goPeople.onclick = function(){ ui.view = "people"; setActiveTab(); renderAll(); };
    fsPeople.appendChild(goPeople);
    host.appendChild(fsPeople);
  }
}

/* ============================== boot =================================== */
function renderMentionsBadge(){
  var wrap = document.getElementById("mentionsWrap");
  if(!canBook()){ wrap.style.display = "none"; return; }
  wrap.style.display = "inline-flex";
  document.getElementById("mentionsCount").textContent = me.mention_count ? String(me.mention_count) : "";
  document.getElementById("mentionsBtn").classList.toggle("has-mentions", !!me.mention_count);
}
async function refreshMentions(){
  var r = await api("/api/me");
  if(r.ok) me.mention_count = r.body.mention_count;
  renderMentionsBadge();
}
async function toggleMentionsPop(){
  var pop = document.getElementById("mentionsPop");
  if(!pop.hidden){ pop.hidden = true; return; }
  var r = await api("/api/my_mentions");
  pop.innerHTML = "";
  if(!r.ok || !r.body.mentions.length){
    pop.appendChild(el("p","hint","No new mentions."));
  } else {
    r.body.mentions.forEach(function(m){
      var item = el("button","mentionitem");
      item.type = "button";
      item.appendChild(el("div","mentionitem-head", (m.from_name||"Someone") + " on " + shortDate(m.show_date) + " · " + m.venue));
      item.appendChild(el("p","mentionitem-body", m.body));
      item.onclick = async function(){
        pop.hidden = true;
        await openEvent(m.event_id);
        await refreshMentions();
      };
      pop.appendChild(item);
    });
  }
  pop.hidden = false;
}

async function boot(){
  var r = await api("/api/me");
  if(!r.ok){ document.getElementById("loginCard").style.display = "block"; document.getElementById("app").style.display = "none"; return; }
  me = r.body;
  document.getElementById("loginCard").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("whoami").textContent = me.name + " · " + me.access_level;
  renderMentionsBadge();
  document.getElementById("navTabs").style.display = "flex";
  document.getElementById("bookBtn").style.display = canBook() ? "inline-block" : "none";
  document.getElementById("filterbar").style.display = "flex";
  if(!canBook()){
    // Crew gets the calendar and their own theme preference — booking,
    // staffing, and admin views are booker/owner-only screens.
    document.querySelectorAll("#navTabs button").forEach(function(b){
      if(b.dataset.view !== "calendar" && b.dataset.view !== "settings") b.remove();
    });
  }
  await loadBookerLookups();
  await loadEvents();
}

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;
  var r = await api("/api/login", {method:"POST", body: JSON.stringify({email:email, password:password})});
  if(r.ok) boot();
  else document.getElementById("loginError").textContent = "Wrong email or password.";
});
document.getElementById("logoutBtn").addEventListener("click", async function(){
  await api("/api/logout", {method:"POST"});
  document.getElementById("app").style.display = "none";
  document.getElementById("loginCard").style.display = "block";
});
document.getElementById("navTabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-view]");
  if(!b) return;
  ui.view = b.dataset.view;
  setActiveTab();
  renderAll();
});
function goToPrevMonth(){ ui.cursor.m--; if(ui.cursor.m<0){ui.cursor.m=11;ui.cursor.y--;} renderAll(); }
function goToNextMonth(){ ui.cursor.m++; if(ui.cursor.m>11){ui.cursor.m=0;ui.cursor.y++;} renderAll(); }
document.getElementById("prevMonth").addEventListener("click", goToPrevMonth);
document.getElementById("nextMonth").addEventListener("click", goToNextMonth);
document.getElementById("todayBtn").addEventListener("click", function(){ var t=new Date(); ui.cursor={y:t.getFullYear(),m:t.getMonth()}; renderAll(); });
document.getElementById("showDeadToggle").addEventListener("change", function(e){ ui.showDead = e.target.checked; renderAll(); });
document.getElementById("bookBtn").addEventListener("click", function(){ openEvent(null, todayISO()); });
document.getElementById("addPersonBtn").addEventListener("click", function(){ openPersonForm(null); });
document.getElementById("mentionsBtn").addEventListener("click", toggleMentionsPop);
document.addEventListener("click", function(e){
  var wrap = document.getElementById("mentionsWrap");
  if(!wrap.contains(e.target)) document.getElementById("mentionsPop").hidden = true;
});
document.getElementById("sheetClose").addEventListener("click", closeSheet);
document.getElementById("scrim").addEventListener("click", function(e){ if(e.target === document.getElementById("scrim")) closeSheet(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !document.getElementById("scrim").hidden) closeSheet(); });

/* Scrolling past the top/bottom of the page while on the calendar moves a
   month, so a mouse wheel becomes a quick way to flip months without
   reaching for the arrow buttons. One flip per gesture — wheel fires many
   events per scroll, so a short cooldown stops it jumping several months. */
var lastMonthWheelAt = 0;
window.addEventListener("wheel", function(e){
  if(ui.view !== "calendar" || !document.getElementById("scrim").hidden) return;
  var atBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 2);
  var atTop = window.scrollY <= 0;
  var now = Date.now();
  if(now - lastMonthWheelAt < 700) return;
  if(e.deltaY > 0 && atBottom){ lastMonthWheelAt = now; goToNextMonth(); }
  else if(e.deltaY < 0 && atTop){ lastMonthWheelAt = now; goToPrevMonth(); }
}, {passive:true});
if(phoneMQ){ if(phoneMQ.addEventListener) phoneMQ.addEventListener("change", renderAll); else if(phoneMQ.addListener) phoneMQ.addListener(renderAll); }

boot();
})();
</script>
